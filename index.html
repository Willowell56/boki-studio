<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>簿記スタジオ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#F4F6F8; --surface:#FFF; --ink:#1B2430; --muted:#5E6B7A; --accent:#1A6FB0;
  --accent-soft:#E3EEF7; --line:#DDE4EA; --right:#1E8E3E; --right-soft:#E6F4EA;
  --wrong:#C5221F; --wrong-soft:#FCE8E6; --gold:#B7791F;
  /* 勘定科目5分類(全画面共通・変更禁止) */
  --cls-asset:#1A6FB0; --cls-liab:#C0392B; --cls-equity:#7D3C98;
  --cls-rev:#1E8E3E; --cls-exp:#CA6F1E;
  --shadow:0 1px 3px rgba(27,36,48,.08);
}
@media (prefers-color-scheme: dark){ :root{ --bg:#10151B; --surface:#1A222B; --ink:#E6ECF2;
  --muted:#93A1B0; --accent:#5BA3D9; --accent-soft:#1C2E3E; --line:#2A3441;
  --right:#5BB974; --right-soft:#1B3022; --wrong:#F28B82; --wrong-soft:#3A211F; --gold:#D9A441;
  --cls-asset:#5BA3D9; --cls-liab:#E57368; --cls-equity:#B07CC6; --cls-rev:#5BB974; --cls-exp:#E5A15C; } }
:root[data-theme="dark"]{ --bg:#10151B; --surface:#1A222B; --ink:#E6ECF2;
  --muted:#93A1B0; --accent:#5BA3D9; --accent-soft:#1C2E3E; --line:#2A3441;
  --right:#5BB974; --right-soft:#1B3022; --wrong:#F28B82; --wrong-soft:#3A211F; --gold:#D9A441;
  --cls-asset:#5BA3D9; --cls-liab:#E57368; --cls-equity:#B07CC6; --cls-rev:#5BB974; --cls-exp:#E5A15C; }
:root[data-theme="light"]{ --bg:#F4F6F8; --surface:#FFF; --ink:#1B2430; --muted:#5E6B7A; --accent:#1A6FB0;
  --accent-soft:#E3EEF7; --line:#DDE4EA; --right:#1E8E3E; --right-soft:#E6F4EA;
  --wrong:#C5221F; --wrong-soft:#FCE8E6; --gold:#B7791F;
  --cls-asset:#1A6FB0; --cls-liab:#C0392B; --cls-equity:#7D3C98;
  --cls-rev:#1E8E3E; --cls-exp:#CA6F1E; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));}

header.app{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 16px 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
header.app h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.02em}
header.app .sub{font-size:11px;color:var(--muted);letter-spacing:.06em}

main{max-width:680px;margin:0 auto;padding:14px 14px 24px}
.view{display:block}
.view[hidden]{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px}

/* tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:none;padding:8px 2px 7px;font-family:inherit;
  font-size:10.5px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}

/* buttons */
.btn{display:inline-block;width:100%;padding:13px;border-radius:10px;border:none;background:var(--accent);
  color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.4}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;
  padding:5px 12px;font-size:12.5px;font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip.acct{border-left-width:4px}
.chip:disabled{opacity:.4;cursor:default}

/* quiz .opt パターン(genai-passport-study.htmlの既存UIを踏襲) */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-family:inherit;
  font-size:14px;text-align:left;cursor:pointer;color:var(--ink)}
.opt:not(:disabled):active{background:var(--accent-soft)}
.opt.sel-right{background:var(--right-soft);border-color:var(--right);font-weight:700}
.opt.sel-wrong{background:var(--wrong-soft);border-color:var(--wrong)}
.opt.reveal{border-color:var(--right);border-style:dashed}
.opt:disabled{cursor:default;opacity:.92}

/* ===== セッションオーバーレイ(Task 6: レッスン・ドリル・クイズ) ===== */
.session-overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  display:flex;flex-direction:column}
.session-overlay[hidden]{display:none}
.session-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px 12px;display:flex;align-items:center;gap:10px}
.session-close{flex:none;width:36px;height:36px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:16px;font-family:inherit;cursor:pointer}
.session-title{font-size:12.5px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-body{flex:1;max-width:680px;margin:0 auto;padding:16px 14px 32px;width:100%}

/* 進捗ドット(レッスン) */
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 16px}
.dot{width:7px;height:7px;border-radius:999px;background:var(--line)}
.dot.on{background:var(--accent);width:18px;border-radius:4px}

.lesson-fig{margin:0 0 14px}
.lesson-text{font-size:16px;line-height:1.8;margin:0 0 10px;white-space:pre-wrap}
.easy-panel{background:var(--accent-soft);border-radius:10px;padding:12px;margin-top:8px;font-size:14px;line-height:1.7}
.btn.small{padding:9px;font-size:13px;margin-top:8px}
.confusing-btn{background:none;border:1px dashed var(--line);color:var(--muted);border-radius:10px;
  padding:9px 10px;font-size:12.5px;font-family:inherit;width:100%;margin-top:10px;cursor:pointer}
.nav-row{display:flex;gap:8px;margin-top:16px}
.nav-row .btn{margin-top:0;flex:1}

/* ドリル */
.drill-progress{font-size:12px;color:var(--muted);margin-bottom:4px}
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:999px;margin-bottom:8px}
.drill-prompt{font-size:15px;line-height:1.7;margin:0 0 12px}
.drill-expl{font-size:14px;line-height:1.7;margin:10px 0}
.drill-compare-label{font-size:12px;color:var(--muted);margin:10px 0 2px;font-weight:700}

.entry-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.entry-col{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:70px;cursor:pointer}
.entry-col.focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.entry-col h4{margin:0 0 6px;font-size:11.5px;color:var(--muted);font-weight:700}
.entry-empty{font-size:11.5px;color:var(--muted);padding:10px 2px;text-align:center}
.entry-row{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:7px 6px;
  border-radius:6px;font-size:12.5px;margin-bottom:4px;border-left:3px solid var(--line);
  background:var(--bg);cursor:pointer}
.entry-row.active{background:var(--accent-soft)}
.entry-row .acct{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-row .amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.entry-row .rm{background:none;border:none;color:var(--muted);font-size:13px;padding:0 2px;cursor:pointer;flex:none}

.tenkey-hint{font-size:12.5px;color:var(--muted);text-align:center;padding:16px 0}
.tenkey{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tenkey button{padding:15px 0;font-size:19px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-family:inherit;cursor:pointer}
.tenkey button:active{background:var(--accent-soft)}
.tk-buffer{grid-column:span 3;text-align:right;font-size:22px;font-weight:700;padding:8px 10px;
  background:var(--accent-soft);border-radius:10px;margin-bottom:2px;font-variant-numeric:tabular-nums}
.tk-confirm{grid-column:span 3;background:var(--accent);color:#fff;border-color:var(--accent);
  font-size:15px;font-weight:700}

.journal-wrap{overflow-x:auto;margin:10px 0}
.journal{width:100%;border-collapse:collapse;font-size:12.5px}
.journal th{font-size:11px;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.journal td{padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.journal td.acct{border-left:3px solid var(--line)}
.journal td.amt{text-align:right;font-variant-numeric:tabular-nums}
.journal tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:none}

.fb{border-radius:10px;padding:12px;margin:10px 0;font-size:14px;line-height:1.6}
.fb.ok{background:var(--right-soft);border:1px solid var(--right)}
.fb.ng{background:var(--wrong-soft);border:1px solid var(--wrong)}

.summary{text-align:center;padding:24px 10px 6px}
.summary-lead{font-size:13px;color:var(--muted);margin:0}
.summary .big{font-size:36px;font-weight:800;margin:8px 0}
.celebrate{background:linear-gradient(135deg,var(--accent-soft),var(--right-soft));border:1px solid var(--right);
  border-radius:14px;padding:18px;margin:14px 0;text-align:center}
.celebrate .emoji{font-size:40px;line-height:1}

/* ===== 足場3段階の可視化(scaffold UX) ===== */
.stage-line{font-size:12px;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;
  justify-content:center;gap:4px;flex-wrap:wrap}
.stage-step{padding:2px 7px;border-radius:999px}
.stage-step.current{background:var(--accent-soft);color:var(--accent);font-weight:700}
.stage-arrow{color:var(--line)}
.stage-cleared{color:var(--right)}
.scaffold-next-hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.scaffold-intro-hint{font-size:12.5px;color:var(--accent);background:var(--accent-soft);
  border-radius:8px;padding:8px 10px;margin:0 0 10px}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:13px;z-index:100;box-shadow:var(--shadow);
  max-width:88vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== ホーム画面「今日」(Task 7) ===== */
.today-card{margin-bottom:12px}
.today-card h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700}
.today-card p{margin:0 0 4px}
.today-count{font-size:28px;font-weight:800;margin:2px 0 4px}

.backup-remind-card{position:relative;background:var(--accent-soft);border-color:var(--accent);padding-right:36px}
.backup-remind-card h3{color:var(--ink)}
.backup-remind-dismiss{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;
  line-height:1;cursor:pointer;padding:0}

.streak-card{display:flex;flex-direction:column;align-items:center;text-align:center}
.streak-count{font-size:26px;font-weight:800;display:flex;align-items:baseline;gap:4px}
.streak-count .unit{font-size:13px;font-weight:700;color:var(--muted)}

.goal-ring{width:96px;height:96px;border-radius:999px;margin:8px auto;
  background:conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--line) 0);
  display:flex;align-items:center;justify-content:center}
.goal-ring span{background:var(--surface);width:74px;height:74px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.goal-chips{margin-top:10px;justify-content:center}

/* ===== まなぶ画面(Task 7) ===== */
.badge-mini{display:inline-block;background:var(--line);color:var(--muted);font-size:10.5px;
  font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}

.level-chips{margin-bottom:12px}

.chapter-card{margin-bottom:12px}
.chapter-card h3{margin:0 0 8px;font-size:14.5px}
.chapter-progress{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.chapter-progress .bar{flex:1;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.chapter-progress .bar-fill{height:100%;background:var(--right)}

.topic-list{display:flex;flex-direction:column;gap:4px}
.topic-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:none;border-radius:8px;padding:9px 8px;font-family:inherit;
  font-size:13.5px;color:var(--ink);cursor:pointer}
.topic-row:active{background:var(--accent-soft)}
.topic-row.next-glow{background:var(--accent-soft);box-shadow:0 0 0 1.5px var(--accent);
  animation:boki-glow 1.8s ease-in-out infinite}
@keyframes boki-glow{
  0%,100%{box-shadow:0 0 0 1.5px var(--accent)}
  50%{box-shadow:0 0 0 3px var(--accent)}
}
.topic-icon{flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;
  background:var(--line);color:var(--muted);white-space:nowrap}
.topic-icon.done{background:var(--right-soft);color:var(--right)}
.topic-icon.learning{background:var(--accent-soft);color:var(--accent)}
.topic-icon.progress{background:var(--right-soft);color:var(--accent);font-weight:700}
.topic-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== おみせ(Task 10) ===== */
.shop-appearance{text-align:center}
.shop-name-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px}
.shop-name{margin:0;font-size:18px}
.shop-rename-btn{width:auto;margin-top:0;padding:5px 10px;font-size:11.5px}
.shop-art{font-size:56px;line-height:1.1;margin:10px 0 2px}
.shop-stage-label{margin:0;font-size:13px;font-weight:700;color:var(--accent)}
.shop-progress{margin:2px 0 10px;font-size:12px;color:var(--muted)}
.shop-owned-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:8px;border-top:1px dashed var(--line)}
.owned-icon{font-size:22px}
.shop-empty-hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}

.shop-ledger h3, .shop-catalog h3{margin:0 0 8px;font-size:14px}
.ledger-lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ledger-lines li{font-size:13px;font-variant-numeric:tabular-nums;background:var(--bg);
  border-radius:8px;padding:8px 10px}
.ledger-empty{font-size:13px;color:var(--muted);margin:0}
.ledger-teaser{font-size:12px;color:var(--muted);margin:8px 0 0}

.coin-balance{font-size:15px;font-weight:700;margin:0 0 12px}
.shop-item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shop-item-card{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;background:var(--bg)}
.shop-item-card.owned{border-color:var(--right);background:var(--right-soft)}
.shop-item-card.locked{opacity:.65}
.shop-item-icon{font-size:26px;line-height:1.2}
.shop-item-name{font-size:12.5px;font-weight:700;margin:4px 0 2px}
.shop-item-cost{font-size:12px;color:var(--muted);margin-bottom:6px}
.shop-item-card .btn{padding:9px 4px;font-size:12px}

.stage-celebrate-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;padding:20px}
.stage-celebrate-card{max-width:340px;width:100%}
.stage-celebrate-card .btn{width:100%}

/* ===== 左か右か?瞬発クイズ =====
   5分類の色(--cls-*)は答えを漏らすため一切使わない(無彩色/中立色のみ)。
   左右2つの回答ボタンは常に同じ見た目にし、色でどちらが正解かを示唆しない */
.reflex-mode-row{display:flex;gap:6px;margin-top:2px}
.reflex-mode-row .btn{flex:1;margin-top:0;padding:11px 3px;font-size:12.5px;min-height:44px}
.reflex-prompt{font-size:20px;font-weight:700;text-align:center;margin:22px 0 6px;line-height:1.6}
.reflex-buttons{display:flex;gap:10px;margin:20px 0 4px}
.reflex-buttons .btn{flex:1;margin-top:0;min-height:56px;padding:14px 6px;font-size:15.5px}
.reflex-fb{border-radius:14px;padding:14px;margin:14px 0;text-align:center;font-size:42px;font-weight:800;line-height:1}
.reflex-fb.ok{background:var(--right-soft);color:var(--right)}
.reflex-fb.ng{background:var(--wrong-soft);color:var(--wrong)}
.reflex-rule{font-size:14px;line-height:1.7;text-align:center;margin:0 0 4px}
.reflex-best-badge{color:var(--gold);font-weight:700;margin:6px 0 0}

/* ===== とっくん画面(Task 11) ===== */
.drill-menu-card{margin-bottom:12px}
.drill-menu-card h3{margin:0 0 6px;font-size:14.5px}
.drill-menu-desc{font-size:12.5px;color:var(--muted);margin:0 0 4px}
.drill-menu-hint{font-size:12px;color:var(--muted);margin:6px 0 4px}
.drill-sub-title{font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:700}
.drill-sub-title:first-of-type{margin-top:6px}

/* ミニテストのタイマー・結果 */
.drill-timer{font-weight:700;color:var(--accent);margin-left:6px}
.mt-marks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}
.mt-mark{font-size:11px;font-weight:700;padding:4px 7px;border-radius:6px;background:var(--line);color:var(--muted)}
.mt-mark.ok{background:var(--right-soft);color:var(--right)}
.mt-mark.ng{background:var(--wrong-soft);color:var(--wrong)}

/* ===== きろく画面(Task 11) ===== */
.record-card{margin-bottom:12px}
.record-card h3{margin:0 0 10px;font-size:14px}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h3{margin:0}
.cal-nav{width:32px;height:32px;flex:none;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-family:inherit;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:10.5px;color:var(--muted);padding-bottom:4px}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:8px;background:var(--bg);gap:1px}
.cal-cell.empty{background:none}
.cal-cell.today{box-shadow:0 0 0 1.5px var(--accent) inset}
.cal-cell.has-log{background:var(--accent-soft)}
.cal-day{font-size:11px;color:var(--muted)}
.cal-fire{font-size:12px;line-height:1}

.speed-pct{font-size:13px;font-weight:700;margin:8px 0 0}
.speed-pct.ok{color:var(--right)}
.speed-pct.ng{color:var(--wrong)}

.err-bar-row{margin-bottom:12px}
.err-bar-row:last-child{margin-bottom:0}
.err-bar-label{font-size:12.5px;font-weight:700;margin-bottom:4px}
.err-bar-track{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.err-bar-fill{height:100%;background:var(--accent)}
.err-advice{font-size:12px;color:var(--muted);margin:4px 0 0}

.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary-tile{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
.summary-num{font-size:22px;font-weight:800}
.summary-lbl{font-size:11px;color:var(--muted);margin-top:2px}

.memo-copy-hint{font-size:11.5px;color:var(--muted);margin:6px 0 12px}
.memo-list{display:flex;flex-direction:column;gap:10px}
.memo-row{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}

<script>
/* 学習エンジン(純粋関数)。Task 2以降で実装 */

const BOXES = [0, 1, 3, 7, 14, 30];

function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  const p = x => String(x).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function daysBetween(a, b) {
  return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
}

function srsNext(rec, correct, today, examDate) {
  const r = rec ? { ...rec } : { box: 0, due: today, seen: 0, ok: 0 };
  r.seen += 1;
  if (correct) {
    r.ok += 1;
    r.box = Math.min(r.box + 1, BOXES.length - 1);
    let interval = BOXES[r.box];
    if (examDate) {
      const remain = daysBetween(today, examDate);
      if (remain > 0) interval = Math.min(interval, Math.max(1, Math.floor(remain / 2)));
    }
    r.due = addDays(today, interval);
  } else {
    r.box = Math.max(r.box - 2, 0);
    r.due = today; // 当日中に再出題
  }
  return r;
}

function buildQueue(srsMap, allIds, today, limit, rand = Math.random) {
  const due = [];
  const unseen = [];
  for (const id of allIds) {
    const rec = srsMap[id];
    if (rec) {
      if (rec.due <= today) due.push(id);
    } else {
      unseen.push(id);
    }
  }
  for (let i = due.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    const tmp = due[i];
    due[i] = due[j];
    due[j] = tmp;
  }
  let queue = due.slice(0, limit);
  if (queue.length < limit) {
    queue = queue.concat(unseen.slice(0, limit - queue.length));
  }
  return queue;
}

function entryKey(list) {
  return list.map(e => e.acct).sort().join("|");
}
function entriesEqual(a, b) {
  const norm = l => l.map(e => e.acct + ":" + e.amt).sort().join("|");
  return norm(a) === norm(b);
}
function classifyError(user, ans) {
  if (entriesEqual(user.debit, ans.debit) && entriesEqual(user.credit, ans.credit)) return "correct";
  if (entriesEqual(user.debit, ans.credit) && entriesEqual(user.credit, ans.debit)) return "swap";
  if (entryKey(user.debit) === entryKey(ans.debit) && entryKey(user.credit) === entryKey(ans.credit)) return "amount";
  return "account";
}

const COIN = { first: 30, review: 10, repeat: 3, miss: 1 };
function earnCoins({ firstView, correct, repeatToday }) {
  if (!correct) return COIN.miss;
  if (firstView) return COIN.first;
  if (repeatToday) return COIN.repeat;
  return COIN.review;
}

function updateStreak(st, today, cleared) {
  if (!cleared) return { ...st };
  if (st.lastDate === today) return { ...st };
  if (!st.lastDate) {
    return { count: 1, lastDate: today, freezes: st.freezes, totalDays: st.totalDays + 1 };
  }
  const gap = daysBetween(st.lastDate, today);
  if (gap === 1) {
    return { count: st.count + 1, lastDate: today, freezes: st.freezes, totalDays: st.totalDays + 1 };
  }
  if (gap === 2 && st.freezes > 0) {
    return { count: st.count + 1, lastDate: today, freezes: st.freezes - 1, totalDays: st.totalDays + 1 };
  }
  return { count: 1, lastDate: today, freezes: st.freezes, totalDays: st.totalDays + 1 };
}

function nextFreezeGrant(st, today) {
  const month = today.slice(0, 7);
  if (!st.lastGrant || st.lastGrant < month) {
    return { ...st, freezes: Math.min(2, (st.freezes || 0) + 2), lastGrant: month };
  }
  return { ...st };
}

// お店の段階(Task 10)。0:個人商店 1:人気店 2:株式会社(=3級卒業) 3:メーカー 4:企業グループ 5:上場企業。
// 3級の範囲内では clearedCount/totalTopics の割合だけで0→1→2を決める(1=50%到達、2=全論点クリア)。
// 3(メーカー)以降は2級・1級のコンテンツが未実装のため、この関数は当面0〜2しか返さない
// (段階の名称・アイコン等のデータは3〜5もapp.js側のSHOP_ITEMS/STAGE_NAMESに用意しておき、
// コンテンツ追加時にここへ判定を足すだけで解放できるようにしてある)
function shopStage(clearedCount, totalTopics) {
  if (!totalTopics || totalTopics <= 0) return 0; // 0除算・不正値防御
  if (clearedCount >= totalTopics) return 2;
  if (clearedCount / totalTopics >= 0.5) return 1;
  return 0;
}

// お店の段階(Task 8。級横断・完全版)。0〜2は従来のshopStage(3級進捗)をそのまま流用する。
// 3(メーカー): 3級全論点クリア かつ 工業簿記(2級)の論点を1つ以上クリア
// 4(企業グループ): 3の条件 かつ 連結会計(s09)の全論点クリア
// shopStageは3級ハードコードのため後方互換用に残し、この関数は使わない
function shopStageFull(p) {
  p = p || {};
  var stage = shopStage(p.l3Cleared, p.l3Total);
  if (stage < 2) return stage; // 3級未クリアなら2級の進捗は無視(段階0-2のまま)
  if (!(p.l2IndCleared >= 1)) return 2; // 工業簿記に未着手ならまだ株式会社
  if (p.l2RenketsuAllCleared) return 4;
  return 3;
}

const engine = {
  BOXES, srsNext, addDays, daysBetween,
  buildQueue, classifyError, earnCoins, COIN, updateStreak, nextFreezeGrant,
  shopStage, shopStageFull,
};
if (typeof module !== "undefined") module.exports = engine;
if (typeof window !== "undefined") window.Boki = Object.assign(window.Boki || {}, { engine });

/* 勘定科目マスタ。日商簿記3級・2級(2022年度出題区分表)の範囲。
   cls: asset=資産 / liab=負債 / equity=純資産 / rev=収益 / exp=費用
   level: その科目が初めて出てくる級(3=3級 / 2=2級)。検品スクリプトが級の整合を見る
         (drillのlevelより小さいlevelの科目は「範囲外」としてエラーになる)
   contra: true = 評価勘定。clsの定位置を反転するフラグ
           (asset+contra: 貸倒引当金・減価償却累計額 → 定位置は貸方(右) /
            equity+contra: 引出金 → 定位置は借方(左))
   temp: true = 仮勘定・集合勘定(現金過不足・損益)。UIでは5分類ラベルを断言表示しない
   consol: true = 連結修正仕訳・報告式財務諸表の表示専用科目(売上高・利益剰余金・○○当期首残高 など)。
           個別の帳簿には出てこないので、瞬発クイズ(勘定科目編)の出題プールからは外す */

    "受取商品券", "差入保証金",

    "前払費用", "前払家賃", "前払保険料",
    "未収収益", "未収利息", "未収家賃",

    // ↓評価勘定(資産のマイナス)
    "貸倒引当金",
    "減価償却累計額", "建物減価償却累計額", "備品減価償却累計額", "車両運搬具減価償却累計額",
  ],

    "支払手形", "買掛金", "電子記録債務",

const ASSET_CONTRA_ACCOUNTS = [
  "貸倒引当金",

for (const cls of Object.keys(ACCOUNT_GROUPS)) {
  for (const name of ACCOUNT_GROUPS[cls]) {

/* 決算関連・仮勘定の特別科目 */
ACCOUNTS["損益"] = { cls: "equity", level: 3, temp: true }; // 集合勘定・決算専用：繰越利益剰余金へ振替

// 仮勘定フラグを付与

/* CONTENT本体を探して2級を足しこむ。すでに2級があれば章だけ追記する(二重読み込み対策) */
function bokiContentTarget() {
  if (typeof CONTENT !== "undefined" && CONTENT && CONTENT.levels) return CONTENT;
  if (typeof window !== "undefined" && window.Boki && window.Boki.CONTENT) return window.Boki.CONTENT;
  return null;
}

/* 指定の級へ章を追記する。content-2k.js からも同じ手順で使う(重複idはスキップ) */
function bokiAddChapters(levelId, chapters) {
  const target = bokiContentTarget();
  if (!target) return null;
  const lv = target.levels.filter(function (l) { return l.id === levelId; })[0];
  if (!lv) return null;
  lv.chapters = lv.chapters || [];
  for (const ch of chapters) {
    if (!lv.chapters.some(function (c) { return c.id === ch.id; })) lv.chapters.push(ch);
  }
  return lv;
}

(function mergeLevel2() {
  const target = bokiContentTarget();
  if (!target) return; // Node で単体 require されたときは何もしない
  const existing = target.levels.filter(function (l) { return l.id === 2; })[0];
  if (existing) {
    bokiAddChapters(2, LEVEL2_COMMERCE_CHAPTERS);
  } else {
    target.levels.push(LEVEL2);
    // 級の並びは 3級 → 2級 → 1級 の順に保つ(まなぶ画面のチップの並び順になる)
    target.levels.sort(function (a, b) { return b.id - a.id; });
  }
})();

if (typeof module !== "undefined") module.exports = { LEVEL2, LEVEL2_COMMERCE_CHAPTERS, bokiAddChapters };
if (typeof window !== "undefined") window.Boki = Object.assign(window.Boki || {}, { LEVEL2, bokiAddChapters });

    "学習の記録は今回のセッションだけ有効です(閉じると消えます)。" +
    '<button type="button" id="boki-storage-warn-close" class="btn ghost" style="width:auto;margin:8px 0 0;padding:6px 14px;font-size:12px">閉じる</button>';
  document.body.appendChild(el);
  var closeBtn = document.getElementById("boki-storage-warn-close");
  if (closeBtn) closeBtn.addEventListener("click", function () { el.remove(); });
}

function save() {
  if (!storageAvailable) return; // メモリ動作: 保存は無効
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
  } catch (e) {
    storageAvailable = false;
    showStorageWarning();
  }
}

// load()/importData() 共通のガード(Task 12)。Object.assign(defaultState(), parsed) は
// 「フィールドが無い」場合しか補えない — 壊れたデータ/手動編集で型そのものが入れ替わっている場合
// (例: S.log が配列でなく文字列、S.srs がオブジェクトでなく配列)、後続コードの
// .forEach/.map/Object.keys等がTypeErrorで落ちる。ここで期待する型を再検査し、
// 型が違えば既定値に戻す(壊れていないフィールドはそのまま活かす)
function sanitizeState(parsed) {
  var merged = Object.assign(defaultState(), parsed);
  var def = defaultState();
  ["log", "memos", "shopItems", "shopPurchaseLog"].forEach(function (k) {
    if (!Array.isArray(merged[k])) merged[k] = def[k];
  });
  ["srs", "cleared", "scaffold", "combo", "reflexBest"].forEach(function (k) {
    if (typeof merged[k] !== "object" || merged[k] === null || Array.isArray(merged[k])) merged[k] = def[k];
  });
  if (typeof merged.streak !== "object" || merged.streak === null || Array.isArray(merged.streak)) {
    merged.streak = def.streak;
  }
  // 数値フィールドの型チェック: NaN や型ミスは既定値に戻す
  if (typeof merged.totalAnswers !== "number" || isNaN(merged.totalAnswers)) merged.totalAnswers = def.totalAnswers;
  if (typeof merged.lastBackupAnswers !== "number" || isNaN(merged.lastBackupAnswers)) merged.lastBackupAnswers = def.lastBackupAnswers;
  // reflexBest.home / reflexBest.group / reflexBest.acct はそれぞれ {best10:数値} の形のみ許可する。
  // 壊れたインポート(数値でないbest10等)は当該キーごと削除し既定(未記録)扱いに戻す
  ["home", "group", "acct"].forEach(function (k) {
    var entry = merged.reflexBest[k];
    if (entry !== undefined &&
      (typeof entry !== "object" || entry === null || Array.isArray(entry) ||
        typeof entry.best10 !== "number" || isNaN(entry.best10))) {
      delete merged.reflexBest[k];
    }
  });
  return merged;
}

function load() {
  if (!storageAvailable) return;
  try {
    var raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var parsed = JSON.parse(raw);
    if (parsed && parsed.v === 1) {
      S = sanitizeState(parsed);
    }
  } catch (e) {
    // 壊れたデータは無視して既定値のまま起動する
  }
}

function exportData() {
  return JSON.stringify(S);

// インポートJSONのバージョン検査(v!==1は拒否)と不正データ拒否(Task 12)。
// 呼び出し側(importFromFile)がfalse時にユーザー可視のトーストを出す。
// 成功時はload()と同じsanitizeState()を通す(以前はS=parsed直代入で、
// フィールド欠落・型不正のデータをそのまま採用してしまっていた)
function importData(json) {
  try {
    var parsed = JSON.parse(json);
    if (!parsed || typeof parsed !== "object" || parsed.v !== 1) return false;
    S = sanitizeState(parsed);
    save();
    return true;
  } catch (e) {
    return false;
  }
}

// 端末ローカル日付を "YYYY-MM-DD" で返す(engine.addDaysと同じローカル要素での組み立て。
// toISOString はUTC変換されタイムゾーンによって日付がずれるため使わない)
function localDateStr(d) {
  var p = function (x) { return String(x).padStart(2, "0"); };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function todayStr() {
  return localDateStr(new Date());
}

// log追記+srs更新+coins加算+todaySec加算を一括で行う唯一の窓口
function recordAnswer(id, ok, sec, err) {
  var eng = window.Boki.engine;
  var today = todayStr();

  if (S.todayDate !== today) {
    S.todayDate = today;
    S.todaySec = 0;
    S.coinsToday = 0; // おみせの「今日の帳簿」用(Task 10)。todaySecと同じ日付ロールオーバーで一緒にリセットする
  }

  var firstView = !S.srs[id]; // このitemを一度も解いたことがないか
  var repeatToday = S.log.some(function (e) {
    return e.id === id && e.day === today;
  });

  S.log.push({ id: id, at: new Date().toISOString(), day: today, ok: ok, sec: (sec || 0), err: err });
  if (S.log.length > LOG_LIMIT) {
    S.log.splice(0, S.log.length - LOG_LIMIT); // 直近5000件のリングバッファ
  }
  S.totalAnswers += 1;

  S.srs[id] = eng.srsNext(S.srs[id] || null, ok, today, S.examDate);

  var coins = eng.earnCoins({ firstView: firstView, correct: ok, repeatToday: repeatToday });
  S.coins += coins;
  S.coinsToday = (S.coinsToday || 0) + coins;

  S.todaySec += (sec || 0);

  // 初回誤答時の一度きりの教育トースト(Task 12)。「間違える=悪いこと」という誤解を防ぐ。
  // フィードバック画面(結果画面)に遷移する直前のこのタイミングで出す(問題を解いている最中には出さない)
  if (!ok && !S.missEduSeen) {
    S.missEduSeen = true;
    toast("間違えるほど記憶に残ります。誤答は失敗ではなく学習イベントです");
  }

  save();

  return { coins: coins };
}

// デイリーゴール達成演出(Task 12)。結果画面(ドリル/クイズ/今日の復習の要約)でのみ呼ぶ。
// S.goalCelebratedDate で日付ごとに1回だけtrueを返す(同じ日に何度renderSummaryが
// 呼ばれても再表示しない。翌日になれば日付が変わるので再び達成演出の対象になる)
function checkGoalJustAchieved() {
  var today = todayStr();
  var goalSec = (S.goalMin || 5) * 60;
  var todaySecNow = (S.todayDate === today) ? (S.todaySec || 0) : 0;
  if (todaySecNow >= goalSec && S.goalCelebratedDate !== today) {
    S.goalCelebratedDate = today;
    save();
    return true;
  }
  return false;
}

function goalCelebrateHtml() {
  return '<div class="celebrate"><div class="emoji">🏆</div><p><strong>デイリーゴール達成!</strong></p>' +
    '<p>今日の目標時間を達成しました。おつかれさまです。</p></div>';
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fmtYen(n) { return (n || 0).toLocaleString("ja-JP"); }

// window.prompt/confirmはiframeサンドボックス等「関数として存在するが呼ぶと例外を投げる」環境があるため、
// 呼び出しをtry/catchで包む。例外時はキャンセル相当(null/false)として扱い、描画全体を巻き込んで壊さない。
function safePrompt(msg, def) {
  if (typeof window === "undefined" || typeof window.prompt !== "function") return null;
  try { return window.prompt(msg, def); } catch (e) { return null; }
}
function safeConfirm(msg) {
  if (typeof window === "undefined" || typeof window.confirm !== "function") return false;
  try { return window.confirm(msg); } catch (e) { return false; }
}

// ミニテストのタイマー表示用(ms→ "m:ss")
function fmtTimer(ms) {
  var totalSec = Math.max(0, Math.floor((ms || 0) / 1000));
  var m = Math.floor(totalSec / 60), s = totalSec % 60;
  return m + ":" + String(s).padStart(2, "0");
}

// テーマ適用(Task 11)。"auto"はdata-theme属性を外しOS設定(prefers-color-scheme)に従わせる。
// load()直後・S.theme変更時の両方から呼ぶ
function applyTheme() {
  if (typeof document === "undefined") return;
  var theme = S.theme || "auto";
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
}

// 表示直前のシャッフル専用(Fisher-Yates)。engine.buildQueueの決定的乱数とは別物 — UI描画順のみに使う
function shuffleArr(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

// 勘定科目の5分類色(--cls-*)を左ボーダーに使う。仮勘定(temp)は5分類を断言しないため中立色

  return "border-left-color:var(--cls-" + a.cls + ")";
}

// 勘定科目の定位置(ホームサイド)。contraはclsの定位置を反転する
// (貸倒引当金・減価償却累計額: asset+contra→貸方 / 引出金: equity+contra→借方)
function homeSide(acctName) {
  var a = (window.Boki.ACCOUNTS || {})[acctName];
  if (!a) return null;
  var left = (a.cls === "asset" || a.cls === "exp");
  if (a.contra) left = !left;
  return left ? "debit" : "credit";
}

   renderFig(key, params) が fig キーに応じてインラインSVG文字列を返す。params には

/* figTacct(debitLabel, creditLabel): renderFig(item.fig, item) 経由で呼ばれ、

function figTacct(debitLabel, creditLabel) {

function figGroups5() {

/* figFlow(steps): renderFig(item.fig, item) 経由で item.steps を受け取る。
   item.steps が「2〜6件の短い文字列の配列」であれば、その手順をそのまま描く(2級の
   収益認識5ステップ・銀行勘定調整・有価証券4分類など、論点ごとに手順が異なる画面向け)。
   それ以外(未指定・不正な形)のときは3級の固定3ステップ(仕訳の作り方)を描く。
   3級側は挙動もマークアップも従来のまま変更していない。 */
function figFlow(steps) {
  var isCustom = Array.isArray(steps) && steps.length >= 2 && steps.length <= 6 &&
    steps.every(function (s) { return typeof s === "string" && s.length > 0; });

  if (!isCustom) {
    var defaultSteps = ["①なにが動いた?", "②5グループのどれ?", "③増えた・減った?"];
    var w = 150, gap = 30, y = 40, h = 60, x0 = 10;
    var boxes = defaultSteps.map(function (s, i) {
      var x = x0 + i * (w + gap);
      var arrow = i < defaultSteps.length - 1
        ? '<line x1="' + (x + w) + '" y1="' + (y + h / 2) + '" x2="' + (x + w + gap) + '" y2="' + (y + h / 2) + '" stroke="var(--muted)" stroke-width="2" marker-end="url(#boki-arrow)"/>'
        : "";
      return '<g>' +
        '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>' +
        '<text x="' + (x + w / 2) + '" y="' + (y + h / 2 + 5) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent)">' + s + '</text>' +
        '</g>' + arrow;
    }).join("");
    var totalW = x0 * 2 + defaultSteps.length * w + (defaultSteps.length - 1) * gap;
    return '<svg viewBox="0 0 ' + totalW + ' 140" width="100%" height="140" role="img" aria-label="仕訳の作り方3ステップ">' +
      '<defs><marker id="boki-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker></defs>' +
      boxes + '</svg>';
  }

  // ── ここから先はカスタムステップ(2級など)専用のレイアウト ──
  // 5件以上は375px幅に収まるよう2段に折り返す(1〜4件は横一列)。
  var perRow = steps.length > 4 ? Math.ceil(steps.length / 2) : steps.length;
  var rows = Math.ceil(steps.length / perRow);
  var maxLen = steps.reduce(function (m, s) { return Math.max(m, s.length); }, 0);
  // 長いラベルは2行に折り返す前提で、1行あたりの文字数を短くしてボックス幅を抑える
  var charsPerLine = Math.max(4, Math.min(9, maxLen > 8 ? Math.ceil(maxLen / 2) : maxLen));
  var boxW = Math.max(96, Math.min(170, charsPerLine * 15 + 24));
  var gap = 20, rowGap = 34, x0 = 10, y0 = 16, boxH = 56;

  function wrapLabel(s) {
    if (s.length <= charsPerLine) return [s];
    var l1 = s.slice(0, charsPerLine);
    var l2 = s.slice(charsPerLine);
    if (l2.length > charsPerLine) l2 = l2.slice(0, charsPerLine - 1) + "…";
    return [l1, l2];
  }

  var boxesHtml = "", arrowsHtml = "";
  for (var i = 0; i < steps.length; i++) {
    var row = Math.floor(i / perRow);
    var col = i % perRow;
    var x = x0 + col * (boxW + gap);
    var y = y0 + row * (boxH + rowGap);
    var cx = x + boxW / 2, cy = y + boxH / 2;
    var lines = wrapLabel(steps[i]);
    var textEl = lines.length === 1
      ? '<text x="' + cx + '" y="' + (cy + 5) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent)">' + esc(lines[0]) + '</text>'
      : '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent)">' +
        '<tspan x="' + cx + '" dy="0">' + esc(lines[0]) + '</tspan>' +
        '<tspan x="' + cx + '" dy="15">' + esc(lines[1]) + '</tspan>' +
        '</text>';
    boxesHtml += '<g><rect x="' + x + '" y="' + y + '" width="' + boxW + '" height="' + boxH + '" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>' + textEl + '</g>';

    var isLastOverall = i === steps.length - 1;
    var isLastInRow = col === perRow - 1;
    if (!isLastOverall) {
      if (!isLastInRow) {
        arrowsHtml += '<line x1="' + (x + boxW) + '" y1="' + cy + '" x2="' + (x + boxW + gap) + '" y2="' + cy + '" stroke="var(--muted)" stroke-width="2" marker-end="url(#boki-arrow)"/>';
      } else {
        // 行末→次行先頭への折り返し矢印(S字カーブ)
        var nextY = y0 + (row + 1) * (boxH + rowGap);
        var sx = x + boxW - 10, sy = y + boxH, ex = x0 + boxW / 2, ey = nextY - 4;
        var midY = (sy + ey) / 2;
        arrowsHtml += '<path d="M' + sx + ',' + sy + ' C ' + sx + ',' + midY + ' ' + ex + ',' + midY + ' ' + ex + ',' + ey + '" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#boki-arrow)"/>';
      }
    }
  }
  var totalW = x0 * 2 + perRow * boxW + (perRow - 1) * gap;
  var totalH = y0 * 2 + rows * boxH + (rows - 1) * rowGap;
  return '<svg viewBox="0 0 ' + totalW + ' ' + totalH + '" width="100%" height="' + totalH + '" role="img" aria-label="手順の図">' +
    '<defs><marker id="boki-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker></defs>' +
    boxesHtml + arrowsHtml + '</svg>';
}

/* figSchlatter(standard): 既定(standard未指定)は2分法(予算差異・操業度差異)のみの
   従来どおりの描画(k03 tk0303。ピクセル単位で変更なし)。
   standard===true のときは3分法(tk0604)向けに、標準操業度の目盛りと、標準配賦率線に沿った
   能率差異の水平ブラケットを追加描画する。追加分は末尾に足すだけで既存のgeometry/labelsは
   一切変更しないため、standard未指定時の出力は従来と完全に同一になる。
   3分法の3差異はこの図では次のように対応する(tk0604の本文の式と一致させている):
     予算差異   = 実際発生額 − 予算許容額(実際操業度で評価。実際操業度のタテのブラケット)
     能率差異   = 標準配賦率×(標準操業度−実際操業度)(標準配賦率線に沿ったヨコのブラケット)
     操業度差異 = 固定費率×(実際操業度−基準操業度)(実際操業度のタテのブラケット。式はtk0303と同じ)
   tk0604の数値例(標準950h<実際980h<基準1000h)に合わせ、標準操業度の目盛りは実際操業度より
   左に置く(「実際<標準<基準」ではなく「標準<実際<基準」が、この教材の不利能率差異の並び)。 */
function figSchlatter(standard) {
  var Ox = 44, Oy = 192, xEnd = 318, yTop0 = 15;
  var xStd = 281, xAct = 192;   // 基準操業度・実際操業度
  var yFix = 126, yTop = 44;    // 固定費水準・基準操業度での予算総額
  var budgetSlope = (yTop - yFix) / (xStd - Ox);
  var yBudget = yFix + budgetSlope * (xAct - Ox);   // 予算許容額線上の実際操業度点
  var applySlope = (yTop - Oy) / (xStd - Ox);
  var yApply = Oy + applySlope * (xAct - Ox);        // 標準(予定)配賦率線上の実際操業度点(--cls-rev)
  var yActual = yBudget - 12;                        // 実際発生額(模式的に予算超過を表現)
  // ラベルは var(--surface) の背景チップを敷き、下を通る線に文字が重なっても読めるようにする(kanjorenraku の tag() と同じ考え方)。
  // チップは必ず全ての線分を描き終えたあとに描画順序として最後にまとめて重ねる(先に置くと後から描く線がチップの上に乗ってしまう)
  var lbl = function (x, y, text, color) {
    var w = text.length * 12.8 + 10;
    return '<rect x="' + (x - 5) + '" y="' + (y - 14) + '" width="' + w + '" height="18" rx="4" fill="var(--surface)" fill-opacity="0.92"/>' +
      '<text x="' + x + '" y="' + y + '" font-size="12.5" font-weight="700" fill="' + color + '">' + text + '</text>';
  };
  var geometry =
    '<line x1="' + Ox + '" y1="' + Oy + '" x2="' + xEnd + '" y2="' + Oy + '" stroke="var(--ink)" stroke-width="1.8" marker-end="url(#sc-ax)"/>' +
    '<line x1="' + Ox + '" y1="' + Oy + '" x2="' + Ox + '" y2="' + yTop0 + '" stroke="var(--ink)" stroke-width="1.8" marker-end="url(#sc-ax)"/>' +
    '<line x1="' + Ox + '" y1="' + yFix + '" x2="' + xStd + '" y2="' + yFix + '" stroke="var(--cls-exp)" stroke-width="1.6" stroke-dasharray="3 3"/>' +
    '<line x1="' + Ox + '" y1="' + yFix + '" x2="' + xStd + '" y2="' + yTop + '" stroke="var(--cls-asset)" stroke-width="2"/>' +
    '<line x1="' + Ox + '" y1="' + Oy + '" x2="' + xStd + '" y2="' + yTop + '" stroke="var(--cls-rev)" stroke-width="2"/>' +
    '<line x1="' + xAct + '" y1="' + Oy + '" x2="' + xAct + '" y2="' + (yActual - 10) + '" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="2 3"/>' +
    '<circle cx="' + xAct + '" cy="' + yActual + '" r="3.4" fill="var(--ink)"/>' +
    '<circle cx="' + xAct + '" cy="' + yBudget + '" r="3.4" fill="var(--cls-asset)"/>' +
    '<circle cx="' + xAct + '" cy="' + yApply + '" r="3.4" fill="var(--cls-rev)"/>' +
    '<line x1="' + (xAct + 6) + '" y1="' + yActual + '" x2="' + (xAct + 6) + '" y2="' + yBudget + '" stroke="var(--ink)" stroke-width="1.4"/>' +
    '<line x1="' + (xAct + 6) + '" y1="' + yBudget + '" x2="' + (xAct + 6) + '" y2="' + yApply + '" stroke="var(--cls-liab)" stroke-width="1.4"/>' +
    '<line x1="' + xStd + '" y1="' + (Oy - 4) + '" x2="' + xStd + '" y2="' + (Oy + 4) + '" stroke="var(--ink)" stroke-width="1.4"/>';
  var applyLineLabel = standard ? "標準配賦率線" : "予定配賦率線";
  var labels =
    '<text x="' + (xEnd - 4) + '" y="' + (Oy - 8) + '" text-anchor="end" font-size="12.5" fill="var(--muted)">操業度</text>' +
    '<text x="' + (Ox - 8) + '" y="' + (yTop0 + 4) + '" text-anchor="end" font-size="12.5" fill="var(--muted)">金額</text>' +
    lbl(Ox + 4, yFix - 6, "固定費予算", "var(--cls-exp)") +
    lbl(95, 100, "予算許容額線", "var(--cls-asset)") +
    lbl(95, 172, applyLineLabel, "var(--cls-rev)") +
    '<text x="' + (xAct - 10) + '" y="' + (yActual - 4) + '" text-anchor="end" font-size="12.5" fill="var(--ink)">実際発生額</text>' +
    lbl(xAct + 40, (yActual + yBudget) / 2 + 4, "予算差異", "var(--ink)") +
    lbl(xAct + 40, (yBudget + yApply) / 2 + 4, "操業度差異", "var(--cls-liab)") +
    '<text x="' + xAct + '" y="' + (Oy + 18) + '" text-anchor="middle" font-size="12.5" fill="var(--muted)">実際操業度</text>' +
    '<text x="' + xStd + '" y="' + (Oy + 18) + '" text-anchor="middle" font-size="12.5" fill="var(--muted)">基準操業度</text>';

  var extraGeometry = "", extraLabels = "";
  if (standard) {
    // 標準操業度(tk0604の例=標準950h<実際980h<基準1000hに合わせ、実際操業度より左に置く)。
    // ラベルは実際操業度・基準操業度と同じ行に置くと文字が重なるため、1行下(Oy+34)にずらす。
    // 能率差異のヨコのブラケットは標準配賦率線上の2点のすぐ下(+10)に収め、
    // 予算許容額線・標準配賦率線の各ラベルチップの外側(下・上)に逃がす。
    // 実際操業度側はすでにある縦の点線(実際発生額用)と同じx上に重ねて描くと線が二重になるため、
    // ブラケットの縦線は標準操業度側だけに引き、実際操業度側は既存の縦線・点にそのまま接続させる。
    var xStdVol = 140;
    var yApplyAtStdVol = Oy + applySlope * (xStdVol - Ox);
    var barY = Math.max(yApplyAtStdVol, yApply) + 10;
    extraGeometry =
      '<line x1="' + xStdVol + '" y1="' + (Oy - 4) + '" x2="' + xStdVol + '" y2="' + (Oy + 4) + '" stroke="var(--ink)" stroke-width="1.4"/>' +
      '<circle cx="' + xStdVol + '" cy="' + yApplyAtStdVol + '" r="3.4" fill="var(--cls-rev)"/>' +
      '<line x1="' + xStdVol + '" y1="' + yApplyAtStdVol + '" x2="' + xStdVol + '" y2="' + barY + '" stroke="var(--cls-equity)" stroke-width="1.2" stroke-dasharray="2 3"/>' +
      '<line x1="' + xStdVol + '" y1="' + barY + '" x2="' + xAct + '" y2="' + barY + '" stroke="var(--cls-equity)" stroke-width="1.6"/>';
    extraLabels =
      '<text x="' + xStdVol + '" y="' + (Oy + 34) + '" text-anchor="middle" font-size="12.5" fill="var(--muted)">標準操業度</text>' +
      lbl(140, barY - 8, "能率差異", "var(--cls-equity)");
  }

  return '<svg viewBox="0 0 340 240" width="100%" height="240" role="img" aria-label="シュラッター図(公式法変動予算)">' +
    '<defs><marker id="sc-ax" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--ink)"/></marker></defs>' +
    geometry + extraGeometry + labels + extraLabels +
    '</svg>';
}
