function renderFig(key, params) {
  params = params || {};
  if (key === "groups5") return figGroups5();
  if (key === "tacct") return figTacct(params.debit, params.credit);
  if (key === "flow") return figFlow(params.steps);
  if (key === "kanjorenraku") return figKanjorenraku();
  if (key === "schlatter") return figSchlatter(params.standard === true);
  if (key === "boxwip") return figBoxwip();
  if (key === "timetable") return figTimetable();
  return ""; // 未知キー(shikuri/dep/inventory/closing等)は無視して空文字を返す
}

/* ===== 仕訳の表(Task 6) ===== 正解仕訳・ユーザー解答をT字勘定ではなく表形式で見せる(諸口=複数行に対応) */

function journalTable(entries) {
  var maxLen = Math.max(entries.debit.length, entries.credit.length);
  var rows = "";
  for (var i = 0; i < maxLen; i++) {
    var d = entries.debit[i], c = entries.credit[i];
    rows += '<tr>' +
      '<td class="acct" style="' + (d ? acctBorderStyle(d.acct) : "border-left-color:transparent") + '">' + (d ? esc(d.acct) : "") + '</td>' +
      '<td class="amt">' + (d ? "¥" + fmtYen(d.amt) : "") + '</td>' +
      '<td class="acct" style="' + (c ? acctBorderStyle(c.acct) : "border-left-color:transparent") + '">' + (c ? esc(c.acct) : "") + '</td>' +
      '<td class="amt">' + (c ? "¥" + fmtYen(c.amt) : "") + '</td>' +
      '</tr>';
  }
  var sum = function (l) { return l.reduce(function (s, e) { return s + e.amt; }, 0); };
  return '<div class="journal-wrap"><table class="journal">' +
    '<thead><tr><th colspan="2">借方</th><th colspan="2">貸方</th></tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
    '<tfoot><tr><td class="acct">合計</td><td class="amt">¥' + fmtYen(sum(entries.debit)) + '</td>' +
    '<td class="acct">合計</td><td class="amt">¥' + fmtYen(sum(entries.credit)) + '</td></tr></tfoot>' +
    '</table></div>';
}

/* ===== セッションオーバーレイ基盤(Task 6) =====
   レッスン/ドリル/クイズは #boki-session という単一のオーバーレイ要素へ描画する
   (mainのタブ・view構造は変更しない。ここに重ねるだけ。閉じれば元の画面がそのまま見える)。
   クリックは #boki-session .session-body に1回だけ登録した委譲リスナーが受け、
   実処理は _sessionHandler(現在アクティブなセッションが差し替える関数)に委譲する。
   毎回innerHTMLで再描画する設計のため、要素ごとのリスナー再登録が不要になる。 */

var _sessionHandler = null;
// セッション終了時に呼ぶ後始末フック(Task 11: ミニテストのsetIntervalタイマー解除等)。
// 各セッション起動関数が必要なときだけ差し替える。openSession()で毎回nullにリセットするため、
// 前のセッションの後始末が別セッションへ漏れることはない
var _sessionCleanup = null;

function ensureSessionRoot() {
  if (typeof document === "undefined") return null;
  var root = document.getElementById("boki-session");
  if (root) return root;
  root = document.createElement("div");
  root.id = "boki-session";
  root.className = "session-overlay";
  root.hidden = true;
  root.innerHTML =
    '<div class="session-head">' +
      '<button type="button" class="session-close" aria-label="中断してとじる">✕</button>' +
      '<div class="session-title"></div>' +
    '</div>' +
    '<div class="session-body"></div>';
  document.body.appendChild(root);
  root.querySelector(".session-close").addEventListener("click", function () { closeSession(); });
  root.querySelector(".session-body").addEventListener("click", function (e) {
    if (typeof _sessionHandler === "function") _sessionHandler(e);
  });
  return root;
}

function openSession(title) {
  var root = ensureSessionRoot();
  if (!root) return null;
  root.hidden = false;
  root.querySelector(".session-title").textContent = title || "";
  _sessionCleanup = null; // 新しいセッションの開始時点で前のセッションの後始末フックを必ずクリアする
  return root.querySelector(".session-body");
}

function closeSession() {
  if (typeof document === "undefined") return;
  var root = document.getElementById("boki-session");
  if (root) root.hidden = true;
  if (typeof _sessionCleanup === "function") _sessionCleanup(); // 例: ミニテストのタイマー解除
  _sessionCleanup = null;
  _sessionHandler = null;
  refreshActiveView(); // Task 7: セッション終了後、いま見えているタブ(today/learn)を再描画して反映する
}

function toast(msg) {
  if (typeof document === "undefined") return;
  var el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 1800);
}

/* ===== わかりにくいメモ(Task 6) =====
   レッスン各画面: id=topicId, screen=画面index。ドリル/クイズの解説: id=drill/quiz id, screen=-1 */
function markConfusing(itemId, screenIdx) {
  var note = safePrompt("どこがわかりにくかったですか?(空欄のままでもOKです)", "");
  if (note === null) return; // キャンセル(または環境非対応)
  S.memos.push({ id: itemId, screen: screenIdx, at: new Date().toISOString(), note: note });
  save();
  toast("メモを保存しました。ありがとうございます。");
}

/* ===== レッスンプレイヤー(Task 6) ===== */

function startLesson(topicId) {
  var topic = findTopic(topicId);
  if (!topic || !topic.lesson || !topic.lesson.length) return;
  var body = openSession(topic.title);
  if (!body) return;

  var idx = 0;
  var easyOpen = false;

  function render() {
    var item = topic.lesson[idx];
    var dots = topic.lesson.map(function (_, i) {
      return '<span class="dot' + (i === idx ? ' on' : '') + '"></span>';
    }).join("");
    var figHtml = item.fig ? ('<div class="lesson-fig">' + renderFig(item.fig, item) + '</div>') : "";
    var easyHtml = item.easy
      ? ('<button type="button" class="btn ghost small" data-act="easy-toggle">' +
          (easyOpen ? "やさしい解説をとじる" : "やさしい解説を開く") + '</button>' +
          (easyOpen ? ('<div class="easy-panel">' + esc(item.easy) + '</div>') : ""))
      : "";
    var isLast = idx === topic.lesson.length - 1;
    body.innerHTML =
      '<div class="dots">' + dots + '</div>' +
      figHtml +
      '<p class="lesson-text">' + esc(item.t) + '</p>' +
      easyHtml +
      '<button type="button" class="confusing-btn" data-act="confusing">🤔 ここがわかりにくい</button>' +
      '<div class="nav-row">' +
        '<button type="button" class="btn ghost" data-act="back"' + (idx === 0 ? ' disabled' : '') + '>もどる</button>' +
        '<button type="button" class="btn" data-act="next">' + (isLast ? "ドリルへすすむ" : "次へ") + '</button>' +
      '</div>';
  }

  function onClick(e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.dataset.act;
    if (act === "easy-toggle") { easyOpen = !easyOpen; render(); }
    else if (act === "confusing") { markConfusing(topic.id, idx); }
    else if (act === "back") { if (idx > 0) { idx--; easyOpen = false; render(); } }
    else if (act === "next") {
      if (idx < topic.lesson.length - 1) { idx++; easyOpen = false; render(); }
      else {
        var drillIds = (topic.drills || []).map(function (d) { return d.id; });
        if (drillIds.length) startDrillSession(drillIds, { topicId: topic.id });
        else closeSession();
      }
    }
  }

  _sessionHandler = onClick;
  render();
}

/* ===== 仕訳ドリル(Task 6) =====
   足場3段階(S.scaffold[topicId]): 0=お手本を見るだけ(採点なし・recordAnswerなし)
   1=穴埋め(科目は正解のまま表示、金額だけテンキー入力) 2=全部自力(科目もテンキー上の選択肢から自分で組む)
   opts: { topicId, level } — topicIdを渡すとその論点のscaffold段階を自動参照する。
   levelを明示すればscaffold段階を無視して強制できる(将来の複合復習キュー等向け)。
   3連続正解(level===2に限る)で S.cleared[topicId]=true。連続数は S.combo[topicId] に保持し、
   どのセッション経由でも(ドリルidから逆引きしたtopicIdに対して)同じルールで加算する。 */

// 足場3段階UXの表示専用ヘルパー(進行ルールには関与しない)。
// ドリル要約画面とまなぶ画面の両方から使うため、S.scaffold/S.combo/S.clearedの見た目の
// テキスト化ロジックをここに集約する。
var SCAFFOLD_STEP_LABELS = ["おてほん", "あなうめ", "じぶんで"];

function scaffoldStageLineHtml(topicId) {
  if (S.cleared[topicId]) {
    return '<p class="stage-line">現在の段階: <strong class="stage-cleared">✓クリア済み</strong></p>';
  }
  var stage = S.scaffold[topicId] || 0;
  var stepsHtml = SCAFFOLD_STEP_LABELS.map(function (label, i) {
    return '<span class="stage-step' + (i === stage ? " current" : "") + '">' + label + '</span>';
  }).join('<span class="stage-arrow">→</span>');
  return '<p class="stage-line">現在の段階: ' + stepsHtml + '</p>';
}

function startDrillSession(ids, opts) {
  if (!ids || !ids.length) return;
  opts = opts || {};
  var eng = window.Boki.engine;
  var topic = opts.topicId ? findTopic(opts.topicId) : null;
  var level = (typeof opts.level === "number") ? opts.level
    : (opts.topicId ? (S.scaffold[opts.topicId] || 0) : 2);

  var fullTopicPass = false;
  if (topic) {
    var topicIds = (topic.drills || []).map(function (d) { return d.id; });
    fullTopicPass = topicIds.length > 0 && topicIds.length === ids.length &&
      topicIds.every(function (id) { return ids.indexOf(id) >= 0; });
  }
  var wasCleared = opts.topicId ? !!S.cleared[opts.topicId] : false;

  var body = openSession("仕訳ドリル" + (topic ? "・" + topic.title : ""));
  if (!body) return;

  var pos = 0, correctCount = 0, coinTotal = 0, allCorrectPass = true;
  var stage = "question"; // question | feedback | summary
  var st = null, choices = [], startTime = 0, lastResult = null, lastCoins = 0, easyOpen = false;

  // ミニテスト(Task 11)専用の状態: セッション開始からの経過時間表示用タイマーと、問題ごとの正誤一覧
  var sessionStart = Date.now();
  var okList = [];
  var timerInterval = null;
  if (opts.minitest) {
    timerInterval = setInterval(function () {
      var el = document.getElementById("drill-minitest-timer");
      if (el) el.textContent = fmtTimer(Date.now() - sessionStart);
    }, 1000);
    _sessionCleanup = function () { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } };
  }

  function drillAt(i) { return findDrill(ids[i]); }

  function resetEntry(drill) {
    if (level === 0) { st = null; return; }
    if (level === 1) {
      st = {
        debit: drill.entries.debit.map(function (e) { return { acct: e.acct, amt: null }; }),
        credit: drill.entries.credit.map(function (e) { return { acct: e.acct, amt: null }; }),
        focus: "debit", activeSide: null, activeIdx: null, buf: ""
      };
    } else {
      st = { debit: [], credit: [], focus: "debit", activeSide: null, activeIdx: null, buf: "" };
    }
  }

  function showQuestion() {
    var drill = drillAt(pos);
    resetEntry(drill);
    choices = (level === 2) ? shuffleArr(drill.choices) : [];
    startTime = Date.now(); // 解答秒数は「問題が表示された時点」から計測する
    stage = "question";
    easyOpen = false;
    render();
  }

  function rowHtml(side, i, row) {
    var isActive = st.activeSide === side && st.activeIdx === i;
    var amtDisplay = isActive ? (st.buf === "" ? "0" : st.buf) : (row.amt == null ? "?" : fmtYen(row.amt));
    var rm = (level === 2)
      ? ('<button type="button" class="rm" data-act="rm" data-side="' + side + '" data-idx="' + i + '">✕</button>')
      : "";
    return '<div class="entry-row' + (isActive ? " active" : "") + '" data-act="select-row" data-side="' + side + '" data-idx="' + i + '" style="' + acctBorderStyle(row.acct) + '">' +
      '<span class="acct">' + esc(row.acct) + '</span>' +
      '<span class="amt">¥' + amtDisplay + '</span>' + rm +
      '</div>';
  }

  function renderEntryCols() {
    var dRows = st.debit.map(function (r, i) { return rowHtml("debit", i, r); }).join("") ||
      '<div class="entry-empty">科目を選んでください</div>';
    var cRows = st.credit.map(function (r, i) { return rowHtml("credit", i, r); }).join("") ||
      '<div class="entry-empty">科目を選んでください</div>';
    var focus = st.focus || "debit";
    return '<div class="entry-cols">' +
      '<div class="entry-col' + (focus === "debit" ? " focus" : "") + '" data-act="focus-col" data-side="debit"><h4>借方(左)</h4>' + dRows + '</div>' +
      '<div class="entry-col' + (focus === "credit" ? " focus" : "") + '" data-act="focus-col" data-side="credit"><h4>貸方(右)</h4>' + cRows + '</div>' +
      '</div>';
  }

  function renderChoiceChips() {
    var chips = choices.map(function (name) {
      return '<button type="button" class="chip acct" data-act="add-acct" data-name="' + esc(name) + '" style="' + acctBorderStyle(name) + '">' + esc(name) + '</button>';
    }).join("");
    return '<div class="chips">' + chips + '</div>';
  }

  function renderTenkey() {
    if (!st || st.activeIdx === null) {
      return '<p class="tenkey-hint">科目の行をタップすると金額を入力できます。</p>';
    }
    var keys = ["7", "8", "9", "4", "5", "6", "1", "2", "3", "00", "0", "⌫"];
    var keysHtml = keys.map(function (k) {
      return '<button type="button" data-act="tk" data-k="' + k + '">' + k + '</button>';
    }).join("");
    return '<div class="tenkey">' +
      '<div class="tk-buffer">¥' + (st.buf === "" ? "0" : st.buf) + '</div>' +
      keysHtml +
      '<button type="button" class="tk-confirm" data-act="tk-confirm">確定</button>' +
      '</div>';
  }

  function renderEntryArea(drill) {
    if (level === 0) {
      return journalTable(drill.entries) +
        (drill.expl ? ('<p class="drill-expl">' + esc(drill.expl) + '</p>') : "");
    }
    return renderEntryCols() + (level === 2 ? renderChoiceChips() : "") + renderTenkey();
  }

  function renderFeedback(drill) {
    var r = lastResult;
    var html = "";
    if (r.ok) {
      html += '<div class="fb ok"><strong>○ 正解!</strong> +' + lastCoins + 'コイン</div>';
    } else {
      var msg = r.type === "swap"
        ? "借方と貸方が逆です。「増えたもの」がどちら側かをもう一度考えてみましょう。"
        : r.type === "amount"
          ? "考え方は合っています。金額をたしかめましょう。"
          : "科目の選び方を見直しましょう。";
      html += '<div class="fb ng"><strong>× おしい</strong><br>' + esc(msg) + '</div>';
      if (r.type === "account") {
        html += '<p class="drill-compare-label">あなたの解答</p>' + journalTable(r.userEntries) +
          '<p class="drill-compare-label">正解</p>' + journalTable(drill.entries);
      } else {
        html += journalTable(drill.entries);
      }
    }
    html += '<p class="drill-expl">' + esc(drill.expl) + '</p>';
    if (drill.easy) {
      html += '<button type="button" class="btn ghost small" data-act="easy-toggle">' +
        (easyOpen ? "やさしい解説をとじる" : "やさしい解説を開く") + '</button>' +
        (easyOpen ? ('<div class="easy-panel">' + esc(drill.easy) + '</div>') : "");
    }
    html += '<button type="button" class="confusing-btn" data-act="confusing">🤔 ここがわかりにくい</button>';
    html += '<button type="button" class="btn" data-act="next">' + (pos === ids.length - 1 ? "結果を見る" : "次へ") + '</button>';
    return html;
  }

  function renderSummary() {
    if (opts.minitest) {
      var score = correctCount * 3;
      var full = ids.length * 3;
      var elapsed = fmtTimer(Date.now() - sessionStart);
      var marksHtml = okList.map(function (ok, i) {
        return '<span class="mt-mark ' + (ok ? "ok" : "ng") + '">' + (i + 1) + (ok ? "○" : "×") + '</span>';
      }).join("");
      body.innerHTML =
        '<div class="summary"><p class="summary-lead">ミニテスト結果</p>' +
        '<div class="big">' + score + ' / ' + full + '点</div>' +
        '<p>' + correctCount + ' / ' + ids.length + '問正解・所要時間 ' + elapsed + '</p></div>' +
        '<div class="mt-marks">' + marksHtml + '</div>' +
        '<button type="button" class="btn" data-act="close-session">とじる</button>';
      return;
    }
    var justCleared = opts.topicId && !wasCleared && S.cleared[opts.topicId];
    var html = '<div class="summary">';
    if (level === 0) {
      html += '<p class="summary-lead">お手本を確認しました</p>' +
        '<div class="big">' + ids.length + '問</div>' +
        '<p>おてほんを見終わりました。次は同じ問題を、金額だけ自分で入れてみましょう</p>';
    } else {
      html += '<p class="summary-lead">結果</p>' +
        '<div class="big">' + correctCount + ' / ' + ids.length + '</div>' +
        '<p>コイン獲得: +' + coinTotal + '</p>';
    }
    html += '</div>';

    // 足場3段階の可視化+継続導線(scaffold UX): topicId付きセッションでのみ表示する。
    // 「今は何段階目か」「次はどのボタンで何が始まるか」を要約画面から一目でわかるようにする。
    // 各ボタンは同じ論点のドリルを opts.topicId 付きで再起動するだけ
    // (level明示はしない=S.scaffold[topicId]を毎回参照させ、進行ルールは変えない)
    var continueHtml = "", hasContinue = false;
    if (opts.topicId) {
      html += scaffoldStageLineHtml(opts.topicId);
      if (level === 0) {
        continueHtml = '<button type="button" class="btn" data-act="continue-topic">つぎは あなうめに挑戦 →</button>';
        hasContinue = true;
      } else if (level === 1) {
        continueHtml = allCorrectPass
          ? '<button type="button" class="btn" data-act="continue-topic">つぎは 全部じぶんで解いてみよう →</button>'
          : '<button type="button" class="btn" data-act="continue-topic">もういちど あなうめに挑戦 →</button>';
        hasContinue = true;
      } else if (level === 2 && !S.cleared[opts.topicId]) {
        var remain = Math.max(1, 3 - (S.combo[opts.topicId] || 0));
        continueHtml = '<p class="scaffold-next-hint">クリアまで あと' + remain + '問連続正解</p>' +
          '<button type="button" class="btn" data-act="continue-topic">つづけて挑戦 →</button>';
        hasContinue = true;
      }
    }

    if (justCleared) {
      html += '<div class="celebrate"><div class="emoji">🎉</div><p><strong>論点クリア!</strong></p>' +
        '<p>3連続正解できました。おめでとうございます。</p></div>';
    } else {
      html += continueHtml;
    }
    if (checkGoalJustAchieved()) html += goalCelebrateHtml();
    html += '<button type="button" class="btn' + (hasContinue ? ' ghost' : '') + '" data-act="close-session">とじる</button>';
    body.innerHTML = html;
  }

  function render() {
    if (stage === "summary") { renderSummary(); return; }
    var drill = drillAt(pos);
    var timerHtml = opts.minitest
      ? ' <span id="drill-minitest-timer" class="drill-timer">' + fmtTimer(Date.now() - sessionStart) + '</span>'
      : "";
    var progress = '<div class="drill-progress">' + (pos + 1) + ' / ' + ids.length + '問' + timerHtml + '</div>';
    var scaffoldBadge = level === 0 ? '<span class="badge">おてほん</span>' : level === 1 ? '<span class="badge">あなうめ</span>' : "";
    // level0の1問目にだけ、いま何をする画面かの一回きりの案内を出す(専用の既読フラグは持たず、
    // 「level0セッションの最初の画面」という条件そのものを目印にする)
    var introHint = (level === 0 && pos === 0 && stage === "question")
      ? '<p class="scaffold-intro-hint">まずは完成した仕訳を眺めましょう。解くのは次の周からです</p>'
      : "";
    var html = progress + scaffoldBadge + introHint + '<p class="drill-prompt">' + esc(drill.prompt) + '</p>';
    if (stage === "question") {
      html += renderEntryArea(drill);
      if (level === 0) {
        html += '<button type="button" class="confusing-btn" data-act="confusing">🤔 ここがわかりにくい</button>';
        html += '<button type="button" class="btn" data-act="worked-next">' + (pos === ids.length - 1 ? "ドリルへ" : "次へ") + '</button>';
      } else {
        html += '<button type="button" class="btn" data-act="submit">解答する</button>';
      }
    } else if (stage === "feedback") {
      html += renderFeedback(drill);
    }
    body.innerHTML = html;
  }

  function advance() {
    if (pos < ids.length - 1) { pos++; showQuestion(); }
    else { finish(); }
  }

  function finish() {
    stage = "summary";
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; _sessionCleanup = null; }
    if (fullTopicPass) {
      if (level === 0) { S.scaffold[opts.topicId] = 1; save(); }
      else if (level === 1 && allCorrectPass) { S.scaffold[opts.topicId] = 2; save(); }
    }
    // opts.onFinish(Task 7): 呼び出し側が渡すと自前の要約画面を描画せずに委譲する
    // (例: 「今日の復習」の混在キューでドリル→クイズへ続けて遷移する場合、中間の
    // 要約画面を一瞬映さないようにするため)。渡されなければ従来どおり自前で描画する。
    if (typeof opts.onFinish === "function") {
      opts.onFinish({ correctCount: correctCount, total: ids.length, coinTotal: coinTotal });
      return;
    }
    render();
  }

  function submitAnswer() {
    var drill = drillAt(pos);
    var sec = Math.max(0, Math.round((Date.now() - startTime) / 1000));
    var userEntries = {
      debit: st.debit.map(function (r) { return { acct: r.acct, amt: r.amt || 0 }; }),
      credit: st.credit.map(function (r) { return { acct: r.acct, amt: r.amt || 0 }; })
    };
    var result = eng.classifyError(userEntries, drill.entries);
    var ok = result === "correct";
    if (ok) correctCount++; else allCorrectPass = false;
    if (opts.minitest) okList.push(ok);

    var rec = recordAnswer(drill.id, ok, sec, ok ? null : result);
    lastCoins = rec.coins; coinTotal += rec.coins;
    lastResult = { ok: ok, type: result, userEntries: userEntries };

    // 3連続正解での論点クリアは「全部自力(level 2)」で解いたときだけ数える
    if (level === 2) {
      var tId = drillTopicId(drill.id);
      if (tId) {
        if (ok) {
          S.combo[tId] = (S.combo[tId] || 0) + 1;
          if (S.combo[tId] >= 3 && !S.cleared[tId]) S.cleared[tId] = true;
        } else {
          S.combo[tId] = 0;
        }
        save();
      }
    }

    stage = "feedback";
    render();
  }

  function onClick(e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.dataset.act;
    if (act === "confusing") {
      markConfusing(drillAt(pos).id, -1);
    } else if (act === "easy-toggle") {
      easyOpen = !easyOpen; render();
    } else if (act === "worked-next") {
      advance();
    } else if (act === "focus-col") {
      st.focus = t.dataset.side; render();
    } else if (act === "select-row") {
      var side = t.dataset.side, i = +t.dataset.idx;
      st.activeSide = side; st.activeIdx = i; st.buf = ""; st.focus = side;
      render();
    } else if (act === "rm") {
      var rside = t.dataset.side, ridx = +t.dataset.idx;
      st[rside].splice(ridx, 1);
      // 削除行より後ろにactiveIdxがずれるとポインタが別行を指してしまうため、
      // 同じ列なら常時クリアするか、削除位置より後ろのactiveIdxを1つ詰める
      if (st.activeSide === rside) {
        if (st.activeIdx === ridx) { st.activeSide = null; st.activeIdx = null; st.buf = ""; }
        else if (st.activeIdx > ridx) { st.activeIdx -= 1; }
      }
      render();
    } else if (act === "add-acct") {
      var name = t.dataset.name;
      var focusSide = st.focus || "debit";
      st[focusSide].push({ acct: name, amt: null });
      st.activeSide = focusSide; st.activeIdx = st[focusSide].length - 1; st.buf = "";
      render();
    } else if (act === "tk") {
      if (!st || st.activeIdx === null) return;
      // 行削除等でactiveSide/activeIdxが指す行が存在しなくなっている場合の防御。
      // 本来rmハンドラ側でポインタを追従・クリアするため通らない想定だが、
      // 想定外の経路で不整合が生じてもクラッシュせずポインタをリセットする
      if (st.activeSide == null || !st[st.activeSide][st.activeIdx]) {
        st.activeSide = null; st.activeIdx = null; st.buf = "";
        render();
        return;
      }
      var k = t.dataset.k;
      if (k === "⌫") st.buf = st.buf.slice(0, -1);
      else if (k === "00") { if (st.buf !== "") st.buf += "00"; }
      else st.buf = (st.buf === "0" ? "" : st.buf) + k;
      if (st.buf.length > 9) st.buf = st.buf.slice(0, 9); // 桁数の暴走防止
      var row = st[st.activeSide][st.activeIdx];
      row.amt = st.buf === "" ? null : parseInt(st.buf, 10);
      render();
    } else if (act === "tk-confirm") {
      if (st && st.activeIdx !== null) {
        if (st.activeSide == null || !st[st.activeSide][st.activeIdx]) {
          st.activeSide = null; st.activeIdx = null; st.buf = "";
          render();
          return;
        }
        var row2 = st[st.activeSide][st.activeIdx];
        if (row2.amt == null) row2.amt = 0;
      }
      st.activeSide = null; st.activeIdx = null; st.buf = "";
      render();
    } else if (act === "submit") {
      submitAnswer();
    } else if (act === "next") {
      advance();
    } else if (act === "continue-topic") {
      // 要約画面の「つぎは○○に挑戦」系ボタン。同じ論点を再びtopicId付きで起動し直すだけで、
      // 起動側がS.scaffold[topicId]を毎回参照するため、直前のfinish()で更新された段階が
      // 自動的に反映される(0→1→2の遷移そのものはfinish()側のルールのまま変更しない)
      startDrillSession(ids, { topicId: opts.topicId });
    } else if (act === "close-session") {
      closeSession();
    }
  }

  _sessionHandler = onClick;
  showQuestion();
}

/* ===== クイズ(Task 6) ===== 4択。既存アプリ(genai-passport-study.html)の .opt UIパターンを踏襲 */

function startQuizSession(ids, opts) {
  if (!ids || !ids.length) return;
  opts = opts || {};
  var body = openSession("クイズ");
  if (!body) return;

  var pos = 0, correctCount = 0, coinTotal = 0;
  var stage = "question", order = [], startTime = 0, answered = null, easyOpen = false;

  function quizAt(i) { return findQuiz(ids[i]); }

  function showQuestion() {
    var q = quizAt(pos);
    order = shuffleArr(q.opts.map(function (_, i) { return i; })); // 表示順シャッフル。選択時に元indexへマップし戻す
    answered = null;
    easyOpen = false;
    startTime = Date.now();
    stage = "question";
    render();
  }

  function render() {
    if (stage === "summary") { renderSummary(); return; }
    var q = quizAt(pos);
    var progress = '<div class="drill-progress">' + (pos + 1) + ' / ' + ids.length + '問</div>';
    var optsHtml = '<div class="opts">' + order.map(function (oi) {
      var cls = "opt";
      if (answered !== null) {
        if (oi === q.ans) cls += (answered.chosen === oi ? " sel-right" : " reveal");
        else if (oi === answered.chosen) cls += " sel-wrong";
      }
      var dis = answered !== null ? " disabled" : "";
      return '<button type="button" class="' + cls + '" data-act="opt" data-oi="' + oi + '"' + dis + '>' + esc(q.opts[oi]) + '</button>';
    }).join("") + '</div>';
    var html = progress + '<p class="lesson-text">' + esc(q.q) + '</p>' + optsHtml;
    if (answered !== null) {
      html += '<div class="fb ' + (answered.ok ? "ok" : "ng") + '"><strong>' + (answered.ok ? "○ 正解!" : "× 不正解") + '</strong>' +
        (answered.ok ? (' +' + answered.coins + 'コイン') : '') + '</div>';
      html += '<p class="drill-expl">' + esc(q.expl) + '</p>';
      if (q.easy) {
        html += '<button type="button" class="btn ghost small" data-act="easy-toggle">' +
          (easyOpen ? "やさしい解説をとじる" : "やさしい解説を開く") + '</button>' +
          (easyOpen ? ('<div class="easy-panel">' + esc(q.easy) + '</div>') : "");
      }
      html += '<button type="button" class="confusing-btn" data-act="confusing">🤔 ここがわかりにくい</button>';
      html += '<button type="button" class="btn" data-act="next">' + (pos === ids.length - 1 ? "結果を見る" : "次へ") + '</button>';
    }
    body.innerHTML = html;
  }

  function renderSummary() {
    var html = '<div class="summary"><p class="summary-lead">結果</p>' +
      '<div class="big">' + correctCount + ' / ' + ids.length + '</div>' +
      '<p>コイン獲得: +' + coinTotal + '</p></div>';
    if (checkGoalJustAchieved()) html += goalCelebrateHtml();
    html += '<button type="button" class="btn" data-act="close-session">とじる</button>';
    body.innerHTML = html;
  }

  function onClick(e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.dataset.act;
    var q = quizAt(pos);
    if (act === "opt") {
      if (answered !== null) return;
      var chosen = +t.dataset.oi; // 元のopts配列でのindex(表示順ではない)。q.ansと直接比較できる
      var ok = chosen === q.ans;
      var sec = Math.max(0, Math.round((Date.now() - startTime) / 1000));
      var rec = recordAnswer(q.id, ok, sec, null);
      if (ok) correctCount++;
      coinTotal += rec.coins;
      answered = { chosen: chosen, ok: ok, coins: rec.coins };
      render();
    } else if (act === "easy-toggle") {
      easyOpen = !easyOpen; render();
    } else if (act === "confusing") {
      markConfusing(q.id, -1);
    } else if (act === "next") {
      if (pos < ids.length - 1) { pos++; showQuestion(); }
      else {
        stage = "summary";
        // opts.onFinish(Task 7): startDrillSessionと同じ委譲パターン。渡されていれば
        // 自前の要約画面を描画せず呼び出し側(混在レビューキューの続き)に任せる
        if (typeof opts.onFinish === "function") {
          opts.onFinish({ correctCount: correctCount, total: ids.length, coinTotal: coinTotal });
          return;
        }
        render();
      }
    } else if (act === "close-session") {
      closeSession();
    }
  }

  _sessionHandler = onClick;
  showQuestion();
}

/* ===== ホーム画面(今日)とまなぶ画面(Task 7) =====
   renderToday()/renderLearn() は #view-today / #view-learn の innerHTML を毎回丸ごと再描画する
   (セッションのrender()と同じ設計)。クリックは各viewルート要素に1回だけ委譲リスナーを登録する。
   タブ切替時(showView経由の_viewRenderers)とセッション終了時(closeSession→refreshActiveView)
   の両方で再描画がかかるので、進捗やストリークの変化がすぐ画面に反映される。 */

// 指定した級(levelId)の全drill/quiz idを収集する。呼び出し側は S.level を渡し、
// ホーム・とっくんのキューが「いま選んでいる級」の問題だけになるようにする。
// topics:[] のままの級(準備中)は自然に空集合になる。
// idToTopic: 各drill/quiz idがどの論点(topicId)に属するかのlookup。今日のキューを
// 「着手済み論点」に絞り込む際(renderToday/startReviewQueue)に使う
function levelDrillQuizIds(levelId) {
  var content = (typeof CONTENT !== "undefined") ? CONTENT : (window.Boki && window.Boki.CONTENT);
  var drillIds = [], quizIds = [], idToTopic = {};
  var wanted = levelId || 3;
  var lv = ((content && content.levels) || []).filter(function (l) { return l.id === wanted; })[0];
  (lv && lv.chapters || []).forEach(function (ch) {
    (ch.topics || []).forEach(function (tp) {
      (tp.drills || []).forEach(function (d) { drillIds.push(d.id); idToTopic[d.id] = tp.id; });
      (tp.quiz || []).forEach(function (q) { quizIds.push(q.id); idToTopic[q.id] = tp.id; });
    });
  });
  var drillSet = {}, quizSet = {};
  drillIds.forEach(function (id) { drillSet[id] = true; });
  quizIds.forEach(function (id) { quizSet[id] = true; });
  return { drillIds: drillIds, quizIds: quizIds, allIds: drillIds.concat(quizIds), drillSet: drillSet, quizSet: quizSet, idToTopic: idToTopic };
}

// 論点が着手済みか(おてほんを1回でも開いた=S.scaffoldにキーがある、またはクリア済み)
function isStartedTopic(topicId) {
  return S.scaffold[topicId] !== undefined || !!S.cleared[topicId];
}

// 指定した級(levelId)のdrill/quiz idのうち、親論点が着手済みのものだけを返す。
// 新規論点は必ずstartLesson(足場0→1→2)を通す設計のため、今日のキュー
// (buildQueueの「新しい問題」バックフィル対象)には未着手論点のidを混ぜてはいけない。
// kind: 省略=drill+quiz(ホームの復習キュー用) / "drill"=drillのみ(とっくん用)
function startedIds(levelId, kind) {
  var info = levelDrillQuizIds(levelId);
  var ids = (kind === "drill") ? info.drillIds : info.allIds;
  return ids.filter(function (id) { return isStartedTopic(info.idToTopic[id]); });
}

// いま選択中の級(S.level)の級オブジェクト。見つからなければnull
function currentLevelInfo() {
  var content = (typeof CONTENT !== "undefined") ? CONTENT : (window.Boki && window.Boki.CONTENT);
  var wanted = S.level || 3;
  return ((content && content.levels) || []).filter(function (l) { return l.id === wanted; })[0] || null;
}

// ヘッダー右の級表示(template.htmlでは「3級」が初期値として直書きされている)を
// いまのS.levelに合わせる。級を切り替えたときにヘッダーだけ古い級のまま残らないようにする
function syncHeaderLevel() {
  if (typeof document === "undefined") return;
  var el = document.getElementById("hd-sub");
  if (!el) return;
  var lv = currentLevelInfo();
  el.textContent = lv ? lv.name : (S.level || 3) + "級";
}

// S.level(現在選択中の級)の中で、まだクリアしていない最初の論点(章の出現順)を返す
function nextUnclearedTopic() {
  var content = (typeof CONTENT !== "undefined") ? CONTENT : (window.Boki && window.Boki.CONTENT);
  var lv = ((content && content.levels) || []).filter(function (l) { return l.id === (S.level || 3); })[0];
  if (!lv) return null;
  for (var ci = 0; ci < (lv.chapters || []).length; ci++) {
    var topics = lv.chapters[ci].topics || [];
    for (var ti = 0; ti < topics.length; ti++) {
      if (!S.cleared[topics[ti].id]) return topics[ti];
    }
  }
  return null;
}

// いま表示中のタブ(nav.tabs button.on)に対応するrendererを呼び直す。
// セッション(レッスン/ドリル/クイズ)終了直後に呼び、進捗・ストリーク等の変化を画面へ反映する
function refreshActiveView() {
  if (typeof document === "undefined") return;
  var activeBtn = document.querySelector("nav.tabs button.on");
  var name = activeBtn ? activeBtn.dataset.v : null;
  if (name && typeof _viewRenderers[name] === "function") _viewRenderers[name]();
}

/* ----- 今日の復習キュー(ドリル→クイズを1セッションとして連結して回す) ----- */
// UX方針: 「今日の復習◯問」は1タップで完結させたいので、buildQueueが返す
// (drill/quiz混在の)idリストをドリルid/クイズidに振り分け、ドリル→クイズの順で
// 自動的に連続実行する(brief記載の`startDrillSession(buildQueue(...), {mixed:true})`を
// 素直に呼ぶと、キューにクイズidが混ざっていた場合findDrillが見つからず落ちるため、
// 呼び出し側でtypeごとに振り分ける設計にした)。どちらのセッションも空なら省略する。
// 全パート消化後にのみ updateStreak を呼び、その場でストリーク演出画面を描画する。
// opts: { precomputedQueue } — renderToday()から渡された場合、そのキューを使用する。
// 渡されなければ新たにbuildQueueで生成(後方互換性のため)。
function startReviewQueue(opts) {
  opts = opts || {};
  var eng = window.Boki.engine;
  var info = levelDrillQuizIds(S.level);
  var today = todayStr();
  var queue = opts.precomputedQueue || eng.buildQueue(S.srs, startedIds(S.level), today, 20, Math.random);
  if (!queue.length) { toast("復習する項目がありません"); return; }

  var drillPart = queue.filter(function (id) { return info.drillSet[id]; });
  var quizPart = queue.filter(function (id) { return info.quizSet[id]; });
  var stats = { correct: 0, total: 0, coins: 0 };

  function addStats(r) { stats.correct += r.correctCount; stats.total += r.total; stats.coins += r.coinTotal; }

  function finalizeCelebrate() {
    var prevCount = S.streak.count;
    S.streak = eng.updateStreak(S.streak, today, true);
    save();
    var gained = S.streak.count > prevCount;
    // ストリーク節目(7/30/100日)演出(Task 12)。updateStreakはlastDate===todayなら
    // 状態を変えずに返す(=1日1回しか加算されない)ため、gainedをその日の初回判定に使え、
    // 同日中に「今日の復習」を複数回まわしても節目演出は重複表示されない
    var milestone = gained && [7, 30, 100].indexOf(S.streak.count) >= 0;
    var justGoal = checkGoalJustAchieved();
    var root = ensureSessionRoot();
    var titleEl = root ? root.querySelector(".session-title") : null;
    if (titleEl) titleEl.textContent = "今日の復習 完了";
    var body = document.querySelector("#boki-session .session-body");
    if (!body) return;
    var html =
      '<div class="summary"><p class="summary-lead">今日の復習 完了</p>' +
      '<div class="big">' + stats.correct + ' / ' + stats.total + '</div>' +
      '<p>コイン獲得: +' + stats.coins + '</p></div>' +
      '<div class="celebrate"><div class="emoji">🔥</div>' +
      '<p><strong>ストリーク ' + S.streak.count + '日' + (gained ? "(+1)" : "") + '</strong></p>' +
      '<p>フリーズ残り' + S.streak.freezes + '個</p></div>';
    if (milestone) {
      html += '<div class="celebrate"><div class="emoji">🎊</div><p><strong>' + S.streak.count + '日達成!</strong></p>' +
        '<p>継続の力です。これからも続けましょう。</p></div>';
    }
    if (justGoal) html += goalCelebrateHtml();
    html += '<button type="button" class="btn" data-act="close-session">とじる</button>';
    body.innerHTML = html;
    _sessionHandler = function (e) {
      if (e.target.closest('[data-act="close-session"]')) closeSession();
    };
  }

  function runQuiz() {
    if (quizPart.length) {
      startQuizSession(quizPart, { onFinish: function (r) { addStats(r); finalizeCelebrate(); } });
    } else {
      finalizeCelebrate();
    }
  }

  if (drillPart.length) {
    // topicIdを渡さない(=level省略時のデフォルト)ことで足場段階に関係なく全部自力(level 2)で
    // 出題される。復習キューは論点横断のため、単一のtopicId/scaffoldに紐づけない設計
    startDrillSession(drillPart, { mixed: true, level: 2, onFinish: function (r) { addStats(r); runQuiz(); } });
  } else {
    runQuiz();
  }
}

// バックアップリマインダーカード。claude.ai Artifact環境ではrepublish時にlocalStorageが
// 消えることがあるため、前回バックアップ(エクスポート成功)以降に一定件数(30件)以上
// 解答が積み上がったら注意喚起する。当日中に✕で見送った場合は再表示しない
var BACKUP_REMIND_THRESHOLD = 30;
function backupReminderHtml() {
  var today = todayStr();
  if (S.backupRemindSnooze === today) return "";
  var unbacked = (S.totalAnswers || 0) - (S.lastBackupAnswers || 0);
  if (unbacked < BACKUP_REMIND_THRESHOLD) return "";
  return '<div class="card today-card backup-remind-card">' +
      '<button type="button" class="backup-remind-dismiss" data-act="dismiss-backup-remind" aria-label="閉じる">✕</button>' +
      '<h3>💾 最近の記録がバックアップされていません</h3>' +
      '<button type="button" class="btn ghost small" data-act="do-backup">今すぐバックアップ</button>' +
    '</div>';
}

/* ----- renderToday() ----- */
var _todayReviewQueue = null; // 表示中のキューを保持し、クリック時に同じキューを使用する
function renderToday() {
  if (typeof document === "undefined") return;
  var root = document.getElementById("view-today");
  if (!root) return;
  var eng = window.Boki.engine;
  var today = todayStr();

  // 月初にフリーズを補充(brief指定: today表示のたびに呼んで良い。nextFreezeGrantは
  // 月が変わっていなければ実質no-opなので毎回呼んでも安全)
  S.streak = eng.nextFreezeGrant(S.streak, today);
  save();

  // 新規論点は必ずstartLesson(足場0→1→2)を通す設計のため、buildQueueに渡すid pool は
  // 「着手済み論点(S.scaffold[topicId]!==undefined || S.cleared[topicId])」のdrill/quizに
  // 限定する。これをしないと未着手論点のidがbuildQueueの「新しい問題」バックフィルに
  // 混入し、新規ユーザーがいきなり足場2(自力)のドリルへ誘導されてしまう(pedagogy regression)
  _todayReviewQueue = eng.buildQueue(S.srs, startedIds(S.level), today, 20, Math.random);
  // 表示件数はセッション本体(queue, 最大20件)の中でdueなものだけを数える。
  // 全体のdue件数が20を超える場合でも「今日の復習◯問」は1セッション分(最大20)の表示に揃える
  var dueCount = _todayReviewQueue.filter(function (id) { var r = S.srs[id]; return r && r.due <= today; }).length;
  var newCount = _todayReviewQueue.length - dueCount;

  var nt = nextUnclearedTopic();

  var reviewHtml = "";
  if (dueCount > 0 || newCount > 0) {
    var label = "";
    if (dueCount > 0 && newCount > 0) {
      label = "今日の復習 " + dueCount + "問 + 新しい問題 " + newCount + "問";
    } else if (dueCount > 0) {
      label = "今日の復習 " + dueCount + "問";
    } else {
      label = "新しい問題 " + newCount + "問";
    }
    reviewHtml =
      '<div class="card today-card">' +
        '<h3>' + label + '</h3>' +
        '<p class="today-count">' + _todayReviewQueue.length + '問</p>' +
        '<button type="button" class="btn" data-act="start-review">はじめる</button>' +
      '</div>';
  }

  // 「新しい論点に進もう」カード: 着手済み論点の復習キュー(reviewHtml)とは独立に、
  // 未クリアの論点があれば常に表示する。両方の条件が同時に成り立つ場合(復習キューあり
  // かつ未着手論点あり)は2枚並べて表示してよい(復習+次の論点の導線を両方見せるのは
  // 意図的なUX)。新規ユーザー(復習キュー空)はこのカードのみが表示される
  var nextTopicHtml = "";
  if (nt) {
    nextTopicHtml =
      '<div class="card today-card">' +
        '<h3>新しい論点に進もう</h3><p>' + esc(nt.title) + '</p>' +
        '<button type="button" class="btn" data-act="goto-topic" data-topic="' + esc(nt.id) + '">' + esc(nt.title) + 'をはじめる</button>' +
      '</div>';
  } else if (!reviewHtml) {
    // 論点が1つもない級(コンテンツ準備中)を「全クリア」と誤って祝わないよう先に切り分ける
    nextTopicHtml = levelTopicIds(S.level).length
      ? '<div class="card today-card"><h3>復習は完了しています</h3><p>すべての論点をクリアしました。おつかれさまです!</p></div>'
      : '<div class="card today-card"><h3>この級は準備中です</h3><p>まなぶ画面で級を切り替えると学習をはじめられます。</p></div>';
  }
  reviewHtml = reviewHtml + nextTopicHtml;

  var examHtml;
  if (S.examDate) {
    var d = eng.daysBetween(today, S.examDate);
    examHtml = '<div class="card today-card"><h3>試験まで</h3>' +
      '<p class="today-count">あと' + d + '日</p>' +
      '<button type="button" class="btn ghost small" data-act="set-exam">日付を変更</button></div>';

  }

  var streakHtml =
    '<div class="card today-card streak-card">' +
      '<div class="streak-count">🔥' + S.streak.count + '<span class="unit">日</span></div>' +
      '<p>フリーズ残り ' + S.streak.freezes + '個</p>' +
    '</div>';

  var goalMin = S.goalMin || 5;
  var goalSec = goalMin * 60;
  var todaySecNow = (S.todayDate === today) ? (S.todaySec || 0) : 0;
  var pct = goalSec > 0 ? Math.min(100, Math.round((todaySecNow / goalSec) * 100)) : 0;
  var achieved = todaySecNow >= goalSec;
  var goalHtml =
    '<div class="card today-card">' +
      '<h3>デイリーゴール</h3>' +
      '<div class="goal-ring" style="--pct:' + pct + '"><span>' + pct + '%</span></div>' +
      '<div class="chips goal-chips">' +
        [5, 10, 20].map(function (m) {
          return '<button type="button" class="chip' + (goalMin === m ? " on" : "") + '" data-act="set-goal" data-min="' + m + '">' + m + '分</button>';
        }).join("") +
      '</div>' +
      (achieved ? '<button type="button" class="btn" data-act="start-review">達成!もう1セットやる?</button>' : '') +
    '</div>';

  // いま学習中の級。キュー(今日の復習・新しい論点)はこの級の問題だけから作られるので、
  // どの級を勉強しているのかをホームの先頭で明示する。切り替えはまなぶ画面の級チップで行う
  var lvInfo = currentLevelInfo();
  var levelHtml =
    '<div class="card today-card">' +
      '<h3>いまの級</h3>' +
      '<p>' + esc(lvInfo ? lvInfo.name : "3級") + ' を学習中</p>' +
      '<button type="button" class="btn ghost small" data-act="goto-learn">級をかえる</button>' +
    '</div>';

  root.innerHTML = backupReminderHtml() + levelHtml + reviewHtml + examHtml + streakHtml + goalHtml;
}

function todayClickHandler(e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.dataset.act;
  if (act === "start-review") {
    // renderToday()で生成したキューを利用し、表示と実際のセッションで同じキューを使う
    startReviewQueue({ precomputedQueue: _todayReviewQueue });
  } else if (act === "goto-topic") {
    startLesson(t.dataset.topic);
  } else if (act === "goto-learn") {
    showView("learn"); // 級の切り替えはまなぶ画面の級チップに集約する
  } else if (act === "set-goal") {
    S.goalMin = +t.dataset.min; save(); renderToday();
  } else if (act === "set-exam") {
    promptExamDate();
  } else if (act === "do-backup") {
    doExport().then(function () { renderToday(); }).catch(function () { renderToday(); });
  } else if (act === "dismiss-backup-remind") {
    S.backupRemindSnooze = todayStr();
    save();
    renderToday();
  }
}

// 試験日設定。window.promptによる簡易入力(brief記載の「設定導線」)。値検証はYYYY-MM-DD形式のみ
function promptExamDate() {
  var input = safePrompt("試験日を入力してください(YYYY-MM-DD形式。空欄で解除)", S.examDate || "");
  if (input === null) return; // キャンセル(または環境非対応)
  if (input === "") { S.examDate = null; save(); renderToday(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(input)) { toast("YYYY-MM-DD の形式で入力してください"); return; }
  var d = new Date(input + "T00:00:00");
  var valid = !isNaN(d) && input === localDateStr(d);
  if (!valid) { toast("YYYY-MM-DD の形式で入力してください"); return; }
  S.examDate = input;
  save();
  renderToday();
}

/* ----- renderLearn() ----- */
function renderLearn() {
  if (typeof document === "undefined") return;
  var root = document.getElementById("view-learn");
  if (!root) return;
  var content = (typeof CONTENT !== "undefined") ? CONTENT : (window.Boki && window.Boki.CONTENT);
  var levels = (content && content.levels) || [];
  var activeLevel = S.level || 3;

  // 級チップ。ready:true の級はタップで S.level を切り替えられる(3級⇄2級を自由に行き来できる)。
  // ready:false の級は「準備中」バッジのままタップしても切り替わらない。
  // 級を切り替えるとホーム・とっくん・おみせの母集団(出題対象)もその級だけになる
  var chipsHtml = '<div class="chips level-chips">' +
    levels.map(function (lv) {
      var cls = "chip" + (lv.id === activeLevel ? " on" : "");
      var badge = !lv.ready ? '<span class="badge-mini">準備中</span>' : "";
      return '<button type="button" class="' + cls + '" data-act="select-level" data-level="' + lv.id + '"' +
        ' data-level-name="' + esc(lv.name) + '"' +
        (!lv.ready ? ' data-notready="1"' : '') + '>' + esc(lv.name) + badge + '</button>';
    }).join("") +
    '</div>';

  var lv = levels.filter(function (l) { return l.id === activeLevel; })[0];
  var chaptersHtml;
  if (!lv || !lv.ready) {
    chaptersHtml = '<div class="card"><p>この級はまだ準備中です。</p></div>';
  } else {
    var foundNext = false; // 章をまたいで最初の1件だけ.next-glowで光らせる
    chaptersHtml = (lv.chapters || []).map(function (ch) {
      var topics = ch.topics || [];
      if (!topics.length) {
        return '<div class="card chapter-card"><h3>' + esc(ch.title) + '<span class="badge-mini">準備中</span></h3></div>';
      }
      var clearedCount = topics.filter(function (tp) { return S.cleared[tp.id]; }).length;
      var pct = Math.round((clearedCount / topics.length) * 100);
      var topicsHtml = topics.map(function (tp) {
        // 足場3段階の進み具合をバッジ文言に反映する(進行ルール自体はS.scaffold/S.combo/S.clearedのまま、
        // ここは表示のみ): 未着手→おてほん済み(scaffold1)→あなうめ合格(scaffold2・combo0)
        // →あと◯問でクリア(scaffold2・combo>0)→✓クリア
        var stage = S.scaffold[tp.id] || 0;
        var combo = S.combo[tp.id] || 0;
        var state, label;
        if (S.cleared[tp.id]) {
          state = "done"; label = "✓クリア";
        } else if (stage >= 2 && combo > 0) {
          state = "progress"; label = "あと" + Math.max(1, 3 - combo) + "問でクリア";
        } else if (stage >= 2) {
          state = "learning"; label = "あなうめ合格";
        } else if (stage >= 1) {
          state = "learning"; label = "おてほん済み";
        } else {
          state = "new"; label = "未着手";
        }
        var glow = "";
        if (!S.cleared[tp.id] && !foundNext) { glow = " next-glow"; foundNext = true; }
        return '<button type="button" class="topic-row' + glow + '" data-act="open-topic" data-topic="' + esc(tp.id) + '">' +
          '<span class="topic-icon ' + state + '">' + label + '</span>' +
          '<span class="topic-title">' + esc(tp.title) + '</span>' +
          '</button>';
      }).join("");
      return '<div class="card chapter-card">' +
        '<h3>' + esc(ch.title) + '</h3>' +
        '<div class="chapter-progress"><span>' + clearedCount + ' / ' + topics.length + '</span>' +
        '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>' +
        '<div class="topic-list">' + topicsHtml + '</div>' +
        '</div>';
    }).join("");
  }

  root.innerHTML = chipsHtml + chaptersHtml;
  syncHeaderLevel(); // 級チップで切り替えた直後もヘッダーを追従させる
}

function learnClickHandler(e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.dataset.act;
  if (act === "select-level") {
    if (t.dataset.notready) { toast("準備中です"); return; }
    var next = +t.dataset.level;
    if (next === (S.level || 3)) return; // すでにその級。再描画もトーストも不要
    S.level = next;
    save();
    // 他のタブ(ホーム・とっくん・おみせ)はshowViewのたびに再描画されるので、

    // 論点idで持っているので級をまたいでも混ざらず、行き来しても失われない
    renderLearn();
    toast((t.dataset.levelName || next + "級") + "に切り替えました");

    startLesson(t.dataset.topic);
  }
}

// 指定した級の全論点idを章の出現順で返す(おみせの段階計算の分母用)。
// 件数はハードコードせずCONTENTから毎回数える
function levelTopicIds(levelId) {
  var content = (typeof CONTENT !== "undefined") ? CONTENT : (window.Boki && window.Boki.CONTENT);
  var ids = [];
  var wanted = levelId || 3;
  var lv = ((content && content.levels) || []).filter(function (l) { return l.id === wanted; })[0];
  (lv && lv.chapters || []).forEach(function (ch) {
    (ch.topics || []).forEach(function (tp) { ids.push(tp.id); });
  });
  return ids;
}

// 2級の章を商業(s0x)/工業(k0x)に分けて論点idを返す(おみせ段階3-4の集計用)
function level2ChapterTopicIds(prefix) {
  var content = (typeof CONTENT !== "undefined") ? CONTENT : (window.Boki && window.Boki.CONTENT);
  var lv = ((content && content.levels) || []).filter(function (l) { return l.id === 2; })[0];
  var ids = [];
  (lv && lv.chapters || []).forEach(function (ch) {
    if (ch.id && ch.id.indexOf(prefix) === 0) {
      (ch.topics || []).forEach(function (tp) { ids.push(tp.id); });
    }
  });
  return ids;
}

// 連結会計(2級・章id "s09")のクリア数/総数
function level2RenketsuCounts() {
  var content = (typeof CONTENT !== "undefined") ? CONTENT : (window.Boki && window.Boki.CONTENT);
  var lv = ((content && content.levels) || []).filter(function (l) { return l.id === 2; })[0];
  var ch = ((lv && lv.chapters) || []).filter(function (c) { return c.id === "s09"; })[0];
  var ids = (ch && ch.topics || []).map(function (tp) { return tp.id; });
  var cleared = ids.filter(function (id) { return S.cleared[id]; }).length;
  return { cleared: cleared, total: ids.length };
}

function shopCounts() {
  // おみせの段階0-2は3級進捗に固定(級切替で降格させない)。段階3-4は2級の
  // 商業(s0x)/工業(k0x)/連結(s09)進捗を追加で集計する(Task 8)
  var l3Ids = levelTopicIds(3);
  var l3Cleared = l3Ids.filter(function (id) { return S.cleared[id]; }).length;
  var comIds = level2ChapterTopicIds("s");
  var comCleared = comIds.filter(function (id) { return S.cleared[id]; }).length;
  var indIds = level2ChapterTopicIds("k");
  var indCleared = indIds.filter(function (id) { return S.cleared[id]; }).length;
  var renketsu = level2RenketsuCounts();
  return {
    cleared: l3Cleared, total: l3Ids.length, // 後方互換(既存の呼び出し元向け)
    l3Cleared: l3Cleared, l3Total: l3Ids.length,
    l2ComCleared: comCleared, l2ComTotal: comIds.length,
    l2IndCleared: indCleared, l2IndTotal: indIds.length,
    l2RenketsuCleared: renketsu.cleared, l2RenketsuTotal: renketsu.total,
    l2RenketsuAllCleared: renketsu.total > 0 && renketsu.cleared >= renketsu.total
  };
}

      (ownedIcons.length

        : '<p class="shop-empty-hint">まだ設備がありません。下のショップで買ってみましょう。</p>') +
    '</div>';

  // ---- ②今日の帳簿 ----
  // ゲート: 論点を1つもクリアしていない(=まだ勘定科目を学んでいない)うちは科目名を伏せる
  var studied = Object.keys(S.cleared).length > 0;
  var acctCash = studied ? "現金" : "???";
  var acctSales = studied ? "売上" : "???";
  var acctEquip = studied ? "備品" : "???";
  var today = todayStr();
  var coinsToday = (S.todayDate === today) ? (S.coinsToday || 0) : 0;
  var lines = [];
  if (coinsToday > 0) {
    lines.push('(借)' + esc(acctCash) + ' ' + fmtYen(coinsToday) + ' /(貸)' + esc(acctSales) + ' ' + fmtYen(coinsToday));
  }
  (S.shopPurchaseLog || []).filter(function (p) { return p.day === today; }).forEach(function (p) {
    lines.push('(借)' + esc(acctEquip) + ' ' + fmtYen(p.cost) + ' /(貸)' + esc(acctCash) + ' ' + fmtYen(p.cost));
  });
  var ledgerHtml =
    '<div class="card shop-ledger">' +
      '<h3>今日の帳簿</h3>' +
      (lines.length
        ? ('<ul class="ledger-lines">' + lines.map(function (l) { return '<li>' + l + '</li>'; }).join("") + '</ul>')
        : '<p class="ledger-empty">今日はまだ記録がありません。</p>') +
      (studied ? '' : '<p class="ledger-teaser">「簿記ってなに?」を学ぶと、科目の名前がわかるようになります。</p>') +
    '</div>';

  // ---- ③設備ショップ ----
  var available = S.coins - S.spent;
  var itemsHtml = SHOP_ITEMS.map(function (item) {
    var owned = (S.shopItems || []).indexOf(item.id) >= 0;
    var locked = item.stage > stage;
    var afford = available >= item.cost;
    var disabled = owned || locked || !afford;
    var btnLabel = owned ? "購入済み" : locked ? (esc(STAGE_NAMES[item.stage]) + "になったら解放") : ("購入(¥" + fmtYen(item.cost) + ")");
    return '<div class="shop-item-card' + (owned ? " owned" : "") + (locked ? " locked" : "") + '">' +
      '<div class="shop-item-icon">' + item.icon + '</div>' +
      '<div class="shop-item-name">' + esc(item.name) + '</div>' +
      '<div class="shop-item-cost">¥' + fmtYen(item.cost) + '</div>' +
      '<button type="button" class="btn small" data-act="buy" data-id="' + esc(item.id) + '"' + (disabled ? " disabled" : "") + '>' + btnLabel + '</button>' +
      '</div>';
  }).join("");
  var shopHtml =
    '<div class="card shop-catalog">' +
      '<h3>設備ショップ</h3>' +
      '<p class="coin-balance">のこりコイン: ¥' + fmtYen(available) + '</p>' +
      '<div class="shop-item-grid">' + itemsHtml + '</div>' +
    '</div>';

  root.innerHTML = artHtml + ledgerHtml + shopHtml;

  if (justUp) showStageCelebration(stage);
}

function buyItem(id) {
  var item = SHOP_ITEMS.filter(function (it) { return it.id === id; })[0];
  if (!item) return;
  if ((S.shopItems || []).indexOf(id) >= 0) return; // 二重購入禁止
  var eng = window.Boki.engine;
  var counts = shopCounts();
  var stage = eng.shopStageFull(counts);
  if (item.stage > stage) return; // 未解放の段階
  var available = S.coins - S.spent;
  if (available < item.cost) return; // 残高不足(のこりコインをマイナスにしない)
  S.spent += item.cost;
  S.shopItems.push(id);
  S.shopPurchaseLog.push({ id: id, day: todayStr(), cost: item.cost });
  save();
  toast(item.icon + " " + item.name + " を購入しました!");
  renderShop();
}

function shopClickHandler(e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.dataset.act;
  if (act === "buy") {
    buyItem(t.dataset.id);
  } else if (act === "rename-shop") {
    renameShop();
  }
}

/* ===== 左か右か?瞬発クイズ(とっくんメニュー先頭のウォーミングアップ) =====
   5分類(資産・負債・純資産・収益・費用)の定位置を反射で答えるモード。
   定位置編(レベル0): 増減なし、5分類の名前そのものが問題(資産/負債/純資産/収益/費用)。
   最初に覚えるべき「グループごとのおうち(定位置)」だけを問う、いちばんやさしいモード。
   グループ編: 5分類そのものが問題(資産/負債/純資産/収益/費用 × ふえた/へった)。
   勘定科目編: 具体的な勘定科目(備品/買掛金など)が問題。着手済み論点のドリルに登場する
   勘定科目からcontra/temp(定位置が反転/不定)を除いたものだけを出題する。
   S.srs/S.log/coins/S.scaffoldには一切触れない(recordAnswerを呼ばない)。
   自己ベスト(10問の平均反応秒数)だけをS.reflexBest(home/group/acctの3スロット)に保存する
   軽量な独立モード。 */

// 表示順は5分類共通の並び(CLASSES: 資産/負債/純資産/収益/費用)をそのまま使う
function reflexGroupList() {
  return (typeof CLASSES !== "undefined") ? CLASSES : ((window.Boki && window.Boki.CLASSES) || []);
}

// 5分類の定位置(ふだんの位置)。増えたら定位置、減ったら逆側(figGroups5・homeSideと同じルール)
function reflexGroupSide(cls, dir) {
  var left = (cls === "asset" || cls === "exp");
  if (dir === "dec") left = !left;
  return left ? "debit" : "credit";
}

// homeSide(勘定科目の定位置)を土台に、増減で正誤の正解サイドを決める
function reflexAcctSide(acctName, dir) {
  var home = homeSide(acctName);
  if (!home) return null;
  if (dir === "inc") return home;
  return home === "debit" ? "credit" : "debit";
}

// 勘定科目編の出題プール: 着手済み論点(S.scaffold/S.clearedがある論点)のドリルの正解仕訳に
// 登場する勘定科目から、contra(定位置反転)・temp(仮勘定・定位置不定)・
// consol(連結修正/表示専用で個別の帳簿に定位置を持たない)を除いたもの。
// 該当が1件も無い場合(データ不整合等への保険)は現在の級の科目一覧にフォールバックする
function reflexAcctPool() {
  var accounts = (window.Boki && window.Boki.ACCOUNTS) || (typeof ACCOUNTS !== "undefined" ? ACCOUNTS : {});
  var drillIds = startedIds(S.level, "drill");
  var seen = {}, names = [];
  drillIds.forEach(function (id) {
    var d = findDrill(id);
    if (!d || !d.entries) return;
    (d.entries.debit || []).concat(d.entries.credit || []).forEach(function (row) {
      if (seen[row.acct]) return;
      var info = accounts[row.acct];
      if (!info || info.contra || info.temp || info.consol) return;
      seen[row.acct] = true;
      names.push(row.acct);
    });
  });
  if (names.length) return names;
  var wanted = S.level || 3;
  return Object.keys(accounts).filter(function (n) {
    var info = accounts[n];
    return info && info.level === wanted && !info.contra && !info.temp && !info.consol;
  });
}

// n問ぶんの{key, dir}列を作る。同じ(key,dir)の組が2回連続しないようにする
// (poolやdirの組み合わせが極端に少ない場合の無限ループ対策でtriesに上限を設ける)
function reflexBuildQuestions(pool, n) {
  var qs = [];
  var prevKey = null, prevDir = null;
  for (var i = 0; i < n; i++) {
    var key, dir, tries = 0;
    do {
      key = pool[Math.floor(Math.random() * pool.length)];
      dir = Math.random() < 0.5 ? "inc" : "dec";
      tries++;
    } while (key === prevKey && dir === prevDir && tries < 50);
    qs.push({ key: key, dir: dir });
    prevKey = key; prevDir = dir;
  }
  return qs;
}

// 定位置編(増減なし)用: n問ぶんの{key, dir:null}列を作る。同じ group が2回連続しないようにする
// (増減が無いため、group自体が同じなら見た目も同一問題になる。dirで区別できるgroup/acctとは
// 別に、キー単独での連続一致を避けるロジックが必要)
function reflexBuildHomeQuestions(pool, n) {
  var qs = [];
  var prevKey = null;
  for (var i = 0; i < n; i++) {
    var key, tries = 0;
    do {
      key = pool[Math.floor(Math.random() * pool.length)];
      tries++;
    } while (key === prevKey && tries < 50);
    qs.push({ key: key, dir: null });
    prevKey = key;
  }
  return qs;
}

// 不正解時の一行ルール解説(例:「資産のふだんの位置は左。ふえたら定位置です」)
function reflexRuleText(mode, q, groupLabelMap) {
  var homeLeft, label;
  if (mode === "group") {
    homeLeft = (q.key === "asset" || q.key === "exp");
    label = groupLabelMap[q.key] || q.key;
  } else {
    homeLeft = homeSide(q.key) === "debit";
    label = q.key;
  }
  var homeLabel = homeLeft ? "左" : "右";
  var oppLabel = homeLeft ? "右" : "左";
  return label + "のふだんの位置は" + homeLabel + "。" +
    (q.dir === "inc" ? "ふえたら定位置です" : "へったら逆の" + oppLabel + "です");
}

// 定位置編専用の一行ルール解説(例:「資産のおうちは左側です」)。増減の話を一切しない、
// もっとも素朴な「グループごとのおうち」の言い回し
function reflexHomeRuleText(cls, groupLabelMap) {
  var homeLeft = (cls === "asset" || cls === "exp");
  var label = groupLabelMap[cls] || cls;
  return label + "のおうちは" + (homeLeft ? "左側" : "右側") + "です";
}

function startReflexQuiz(mode) {
  var body = openSession("⚡ 左か右か? 瞬発クイズ");
  if (!body) return;

  var classes = reflexGroupList();
  var groupLabelMap = {};
  classes.forEach(function (c) { groupLabelMap[c.id] = c.label; });

  var pool = (mode === "acct") ? reflexAcctPool() : classes.map(function (c) { return c.id; });
  if (!pool.length) {
    closeSession();
    toast("出題できる勘定科目がまだありません");
    return;
  }

  var TOTAL = 10;
  var questions = (mode === "home") ? reflexBuildHomeQuestions(pool, TOTAL) : reflexBuildQuestions(pool, TOTAL);
  var idx = 0, correctCount = 0, times = [];
  var stage = "question"; // question | feedback | summary
  var qStart = 0, lastOk = null, newBest = false;

  function currentQ() { return questions[idx]; }
  function labelFor(q) { return mode === "acct" ? q.key : (groupLabelMap[q.key] || q.key); }
  function correctSideFor(q) {
    if (mode === "acct") return reflexAcctSide(q.key, q.dir);
    if (mode === "home") return reflexGroupSide(q.key, "inc"); // 定位置編は常に「ふだんの位置」そのものが正解
    return reflexGroupSide(q.key, q.dir);
  }

  function showQuestion() {
    stage = "question";
    qStart = Date.now();
    render();
  }

  function render() {
    if (stage === "summary") { renderSummary(); return; }
    var q = currentQ();
    var promptText = (mode === "home")
      ? labelFor(q) // 定位置編は増減を言わず、グループ名だけを見せる
      : (labelFor(q) + ' が ' + (q.dir === "inc" ? "ふえた" : "へった"));
    var html = '<div class="drill-progress">' + (idx + 1) + ' / ' + TOTAL + '問</div>' +
      '<p class="reflex-prompt">' + esc(promptText) + '</p>';
    if (stage === "question") {
      html += '<div class="reflex-buttons">' +
        '<button type="button" class="btn" data-act="reflex-ans" data-side="debit">← 左(借方)</button>' +
        '<button type="button" class="btn" data-act="reflex-ans" data-side="credit">右(貸方) →</button>' +
        '</div>';
    } else if (stage === "feedback") {
      if (lastOk) {
        html += '<div class="reflex-fb ok">○</div>';
      } else {
        var ruleText = (mode === "home") ? reflexHomeRuleText(q.key, groupLabelMap) : reflexRuleText(mode, q, groupLabelMap);
        html += '<div class="reflex-fb ng">✕</div>' +
          '<p class="reflex-rule">' + esc(ruleText) + '</p>' +
          '<button type="button" class="btn" data-act="reflex-next">つぎへ</button>';
      }
    }
    body.innerHTML = html;
  }

  function advance() {
    _sessionCleanup = null;
    if (idx < TOTAL - 1) { idx++; showQuestion(); }
    else { finish(); }
  }

  function finish() {
    stage = "summary";
    var avg = times.reduce(function (s, t) { return s + t; }, 0) / times.length;
    if (!S.reflexBest[mode]) S.reflexBest[mode] = {};
    var prevBest = S.reflexBest[mode].best10;
    newBest = (typeof prevBest !== "number" || avg < prevBest);
    if (newBest) { S.reflexBest[mode].best10 = avg; save(); }
    render();
  }

  function renderSummary() {
    var avg = times.length ? times.reduce(function (s, t) { return s + t; }, 0) / times.length : 0;
    var bestLine = '';
    if (S.reflexBest[mode] && typeof S.reflexBest[mode].best10 === 'number') {
      bestLine = '<p>自己ベスト: ' + S.reflexBest[mode].best10.toFixed(1) + '秒</p>';
    } else {
      bestLine = '<p>自己ベスト: この記録が初登録!</p>';
    }
    var html = '<div class="summary"><p class="summary-lead">結果</p>' +
      '<div class="big">' + correctCount + ' / ' + TOTAL + '</div>' +
      '<p>平均反応時間: ' + avg.toFixed(2) + '秒</p>' +
      bestLine +
      (newBest ? '<p class="reflex-best-badge">🏆 自己ベスト更新!</p>' : '') +
      '</div>' +
      '<button type="button" class="btn" data-act="reflex-restart">もう1セット</button>' +
      '<button type="button" class="btn ghost" data-act="close-session">とじる</button>';
    body.innerHTML = html;
  }

  function onClick(e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.dataset.act;
    if (act === "reflex-ans") {
      if (stage !== "question") return;
      var q = currentQ();
      var sec = Math.max(0, (Date.now() - qStart) / 1000);
      times.push(sec);
      var ok = t.dataset.side === correctSideFor(q);
      if (ok) correctCount++;
      lastOk = ok;
      stage = "feedback";
      render();
      if (ok) {
        var timer = setTimeout(advance, 300); // 正解: ○を一瞬見せて自動で次へ
        _sessionCleanup = function () { clearTimeout(timer); };
      }
    } else if (act === "reflex-next") {
      advance();
    } else if (act === "reflex-restart") {
      closeSession(); // 前のセッションの後始末(タイマー等)を確実に実行してから新しいセッションを開始
      startReflexQuiz(mode); // もう1セット: 同じモードで作り直す
    } else if (act === "close-session") {
      closeSession();
    }
  }

  _sessionHandler = onClick;
  showQuestion();
}

/* ===== とっくん画面(Task 11) =====
   #view-drill の中だけで完結する軽量な画面切り替え(メニュー/章選択/弱点選択)を
   _drillScreen で管理する。実際の出題(idセットが決まったあと)はすべて既存の
   startDrillSession() へ委譲する。topicIdを渡さないため、常にlevel 2(全部自力)で出題される
   (これは既存のlevel決定ロジック `opts.topicId ? (S.scaffold[...]||0) : 2` にそのまま乗る)。 */
var _drillScreen = "menu"; // menu | chapters | weak

// 誤答タイプの表示名・アドバイス文言(弱点だけ画面・きろく画面の内訳の両方で使う)
var ERR_TYPES = [
  { key: "swap", label: "貸借逆", advice: "借方と貸方が逆になりがちです。「増えたのはどちら側か」を先に考えるくせをつけましょう。" },
  { key: "account", label: "科目選び", advice: "科目の選びまちがいが多いです。5分類の定位置をもう一度確認しましょう。" },
  { key: "amount", label: "金額", advice: "金額のまちがいが多いです。仕訳のあと、金額をもう一度たしかめる習慣をつけましょう。" }
];

// 着手済み論点(S.scaffold[topicId]!==undefined || S.cleared[topicId])のdrill idだけを返す
function drillEligibleInfo() {
  var info = levelDrillQuizIds(S.level);
  var started = startedIds(S.level, "drill");
  return { info: info, startedDrillIds: started };
}

// 「章をえらんで特訓」向け: 1件以上の着手済み論点を持つ章のみ、その論点一覧つきで返す
function drillChapterOptions() {
  var content = (typeof CONTENT !== "undefined") ? CONTENT : (window.Boki && window.Boki.CONTENT);
  var lv = ((content && content.levels) || []).filter(function (l) { return l.id === (S.level || 3); })[0];
  var out = [];
  (lv && lv.chapters || []).forEach(function (ch) {
    var topics = ch.topics || [];
    var startedTopics = topics.filter(function (tp) { return S.scaffold[tp.id] !== undefined || !!S.cleared[tp.id]; });
    if (startedTopics.length) out.push({ id: ch.id, title: ch.title, startedTopics: startedTopics });
  });
  return out;
}

// drill idごとの誤答タイプ内訳(swap/account/amountの回数)と最終誤答日時。
// S.logは解答するたびに積み上がる生ログなので、drill idで集計し直す(quizのerrは常にnullなので自然に除外される)
function drillErrorStats() {
  var stats = {};
  S.log.forEach(function (e) {
    if (!e.err || !findDrill(e.id)) return;
    if (!stats[e.id]) stats[e.id] = { swap: 0, account: 0, amount: 0, lastAt: e.at };
    if (stats[e.id].hasOwnProperty(e.err)) stats[e.id][e.err]++;
    if (e.at > stats[e.id].lastAt) stats[e.id].lastAt = e.at;
  });
  return stats;
}

// 指定した誤答タイプが最頻(タイなら他タイプと同率でも含む)のdrill idを、直近の誤答順に最大10件
function weakByErrorType(type) {
  var stats = drillErrorStats();
  var ids = Object.keys(stats).filter(function (id) {
    var s = stats[id];
    var max = Math.max(s.swap, s.account, s.amount);
    return max > 0 && s[type] === max;
  });
  ids.sort(function (a, b) { return stats[b].lastAt.localeCompare(stats[a].lastAt); });
  return ids.slice(0, 10);
}

// drill idごとの生涯解答回数・正解数・最終解答日時
function drillAttemptStats() {
  var stats = {};
  S.log.forEach(function (e) {
    if (!findDrill(e.id)) return;
    if (!stats[e.id]) stats[e.id] = { attempts: 0, correct: 0, lastAt: e.at };
    stats[e.id].attempts++;
    if (e.ok) stats[e.id].correct++;
    if (e.at > stats[e.id].lastAt) stats[e.id].lastAt = e.at;
  });
  return stats;
}

// 2回以上解いて正答率60%未満のdrill idを、直近の解答順に最大10件
function weakByLowAccuracy() {
  var stats = drillAttemptStats();
  var ids = Object.keys(stats).filter(function (id) {
    var s = stats[id];
    return s.attempts >= 2 && (s.correct / s.attempts) < 0.6;
  });
  ids.sort(function (a, b) { return stats[b].lastAt.localeCompare(stats[a].lastAt); });
  return ids.slice(0, 10);
}

function weakDrillCandidates() {
  var byType = {}, any = false;
  ERR_TYPES.forEach(function (t) {
    byType[t.key] = weakByErrorType(t.key);
    if (byType[t.key].length) any = true;
  });
  var lowAcc = weakByLowAccuracy();
  if (lowAcc.length) any = true;
  return { byType: byType, lowAcc: lowAcc, anyAvailable: any };
}

function drillMenuHtml() {
  var d = drillEligibleInfo();
  var randomDisabled = d.startedDrillIds.length === 0;
  var minitestNeed = 15;
  var minitestDisabled = d.startedDrillIds.length < minitestNeed;
  var weak = weakDrillCandidates();
  var weakDisabled = !weak.anyAvailable;
  var chaptersDisabled = drillChapterOptions().length === 0;
  var reflexAcctDisabled = Object.keys(S.cleared).length === 0;

  var html = "";
  html += '<div class="card drill-menu-card"><h3>⚡ 左か右か? 瞬発クイズ</h3>' +
    '<p class="drill-menu-desc">まずはグループの定位置から</p>' +
    '<div class="reflex-mode-row">' +
      '<button type="button" class="btn" data-act="reflex-start" data-mode="home">定位置編</button>' +
      '<button type="button" class="btn" data-act="reflex-start" data-mode="group">グループ編</button>' +
      (reflexAcctDisabled
        ? '<button type="button" class="btn ghost" disabled>勘定科目編</button>'
        : '<button type="button" class="btn ghost" data-act="reflex-start" data-mode="acct">勘定科目編</button>') +
    '</div>' +
    (reflexAcctDisabled ? '<p class="drill-menu-hint">論点を1つクリアすると解放</p>' : '') +
    '</div>';

  html += '<div class="card drill-menu-card"><h3>ランダム仕訳10問</h3>' +
    '<p class="drill-menu-desc">着手した論点から章をまたいでシャッフル出題します(交互学習)。</p>' +
    (randomDisabled
      ? ('<p class="drill-menu-hint">まずは「まなぶ」でレッスンをすすめましょう。</p><button type="button" class="btn" disabled>ランダム仕訳10問</button>')
      : ('<button type="button" class="btn" data-act="drill-random">ランダム仕訳10問</button>')) +
    '</div>';

function drillClickHandler(e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.dataset.act;
  if (act === "reflex-start") {
    startReflexQuiz(t.dataset.mode);
  } else if (act === "drill-random") {
    var d = drillEligibleInfo();
    var ids = shuffleArr(d.startedDrillIds).slice(0, 10);
    if (!ids.length) { toast("問題がありません"); return; }
    startDrillSession(ids, { level: 2 });
  } else if (act === "drill-goto-chapters") {
    _drillScreen = "chapters"; renderDrillTab();
  } else if (act === "drill-goto-weak") {
    _drillScreen = "weak"; renderDrillTab();
  } else if (act === "drill-back") {
    _drillScreen = "menu"; renderDrillTab();
  } else if (act === "drill-chapter") {
    var ch = drillChapterOptions().filter(function (c) { return c.id === t.dataset.chapter; })[0];
    if (!ch) return;
    var chDrillIds = [];
    ch.startedTopics.forEach(function (tp) { (tp.drills || []).forEach(function (dr) { chDrillIds.push(dr.id); }); });
    var chIds = shuffleArr(chDrillIds).slice(0, 15);
    if (!chIds.length) { toast("問題がありません"); return; }
    _drillScreen = "menu";
    startDrillSession(chIds, { level: 2 });
  } else if (act === "drill-weak-type") {
    var typeIds = weakByErrorType(t.dataset.type);
    if (!typeIds.length) return;
    _drillScreen = "menu";
    startDrillSession(typeIds, { level: 2 });
  } else if (act === "drill-weak-low") {
    var lowIds = weakByLowAccuracy();
    if (!lowIds.length) return;
    _drillScreen = "menu";
    startDrillSession(lowIds, { level: 2 });
  } else if (act === "drill-minitest") {
    var mtInfo = drillEligibleInfo();
    var mtIds = shuffleArr(mtInfo.startedDrillIds).slice(0, 15);
    if (mtIds.length < 15) { toast("問題数が足りません"); return; }
    startDrillSession(mtIds, { level: 2, minitest: true });
  }
}

var _recordCalMonth = null; // "YYYY-MM"。未設定時はrenderRecord()の初回呼び出しで当月に初期化する

function monthLogDays(monthStr) {
  var set = {};
  S.log.forEach(function (e) { if (e.day && e.day.slice(0, 7) === monthStr) set[e.day] = true; });
  return set;
}

function shiftMonth(monthStr, delta) {
  var y = +monthStr.slice(0, 4), m = +monthStr.slice(5, 7) + delta;
  while (m < 1) { m += 12; y--; }
  while (m > 12) { m -= 12; y++; }
  return y + "-" + String(m).padStart(2, "0");
}

function calendarHtml(monthStr) {
  var y = +monthStr.slice(0, 4), m = +monthStr.slice(5, 7);
  var firstDow = new Date(y, m - 1, 1).getDay();
  var daysInMonth = new Date(y, m, 0).getDate();
  var logDays = monthLogDays(monthStr);
  var today = todayStr();
  var dowLabels = ["日", "月", "火", "水", "木", "金", "土"];
  var head = dowLabels.map(function (l) { return '<div class="cal-dow">' + l + '</div>'; }).join("");
  var cells = "";
  for (var i = 0; i < firstDow; i++) cells += '<div class="cal-cell empty"></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var dayStr = monthStr + "-" + String(d).padStart(2, "0");
    var hasLog = !!logDays[dayStr];
    cells += '<div class="cal-cell' + (dayStr === today ? " today" : "") + (hasLog ? " has-log" : "") + '">' +
      '<span class="cal-day">' + d + '</span>' + (hasLog ? '<span class="cal-fire">🔥</span>' : "") +
      '</div>';
  }
  return '<div class="card record-card">' +
    '<div class="cal-head">' +
      '<button type="button" class="cal-nav" data-act="cal-prev" aria-label="前の月">←</button>' +
      '<h3>' + y + '年' + m + '月</h3>' +
      '<button type="button" class="cal-nav" data-act="cal-next" aria-label="次の月">→</button>' +
    '</div>' +
    '<div class="cal-grid">' + head + cells + '</div>' +
    '</div>';
}

// 直近4週の週平均秒数(仕訳ドリルのみ。1週間の解答数が5問未満の週はデータなし扱い)
function weeklySpeedStats() {
  var eng = window.Boki.engine;
  var today = todayStr();
  var entries = S.log.filter(function (e) { return e.sec > 0 && findDrill(e.id); });
  var weeks = [];
  for (var w = 3; w >= 0; w--) {
    var end = eng.addDays(today, -7 * w);
    var start = eng.addDays(today, -7 * w - 6);
    var inWeek = entries.filter(function (e) { return e.day >= start && e.day <= end; });
    var avg = inWeek.length >= 5 ? Math.round(inWeek.reduce(function (s, e) { return s + e.sec; }, 0) / inWeek.length) : null;
    weeks.push({ start: start, end: end, avg: avg, count: inWeek.length });
  }
  return weeks;
}

function speedChartHtml() {
  var weeks = weeklySpeedStats();
  var valid = weeks.filter(function (w) { return w.avg != null; });
  if (valid.length < 2) {
    return '<div class="card record-card"><h3>仕訳スピード</h3>' +
      '<p class="drill-menu-hint">1週間に5問以上解くと、スピードの推移が表示されます。</p></div>';
  }
  var w = 260, h = 80, pad = 8;
  var secs = valid.map(function (x) { return x.avg; });
  var maxSec = Math.max.apply(null, secs), minSec = Math.min.apply(null, secs);
  var range = Math.max(1, maxSec - minSec);
  var stepX = (w - pad * 2) / (valid.length - 1);
  var pts = valid.map(function (x, i) {
    var px = pad + stepX * i;
    var py = pad + (h - pad * 2) * (1 - (x.avg - minSec) / range);
    return { x: px, y: py, avg: x.avg };
  });
  var poly = pts.map(function (p) { return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
  var dots = pts.map(function (p) {
    return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3" fill="var(--accent)"/>' +
      '<text x="' + p.x.toFixed(1) + '" y="' + Math.max(10, p.y - 8).toFixed(1) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' + p.avg + '秒</text>';
  }).join("");
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="90" role="img" aria-label="週平均秒数の推移">' +
    '<polyline points="' + poly + '" fill="none" stroke="var(--accent)" stroke-width="2"/>' + dots + '</svg>';

  var prev = valid[valid.length - 2], cur = valid[valid.length - 1];
  var pct = prev.avg > 0 ? Math.round((prev.avg - cur.avg) / prev.avg * 100) : 0;
  // brief指定: 速くなった(=秒数が減った)ほうをプラス表記にする。pct===0は「速くなった」に含めない(等速は中立表記)
  var cls = pct > 0 ? "ok" : (pct < 0 ? "ng" : "");
  var pctLabel = (pct >= 0 ? "+" : "") + pct + "%";
  var pctSuffix = pct > 0 ? "(速くなっています)" : (pct < 0 ? "(前より時間がかかっています)" : "(先週と同じペースです)");
  var pctHtml = '<p class="speed-pct ' + cls + '">先週比 ' + pctLabel + pctSuffix + '</p>';

  return '<div class="card record-card"><h3>仕訳スピード</h3>' + svg + pctHtml + '</div>';
}

function errorBreakdownHtml() {
  var counts = { swap: 0, account: 0, amount: 0 };
  S.log.forEach(function (e) { if (e.err && counts.hasOwnProperty(e.err)) counts[e.err]++; });
  var total = counts.swap + counts.account + counts.amount;
  if (!total) {
    return '<div class="card record-card"><h3>誤答タイプ内訳</h3><p class="drill-menu-hint">まだ誤答の記録がありません。</p></div>';
  }
  var max = Math.max(1, counts.swap, counts.account, counts.amount);
  var rows = ERR_TYPES.map(function (t) {
    var n = counts[t.key];
    var pct = Math.round((n / max) * 100);
    return '<div class="err-bar-row">' +
      '<div class="err-bar-label">' + esc(t.label) + '(' + n + ')</div>' +
      '<div class="err-bar-track"><div class="err-bar-fill" style="width:' + pct + '%"></div></div>' +
      (n > 0 ? ('<p class="err-advice">' + esc(t.advice) + '</p>') : "") +
      '</div>';
  }).join("");
  return '<div class="card record-card"><h3>誤答タイプ内訳</h3>' + rows + '</div>';
}

function summaryStatsHtml() {

// メモ1件を表示・コピー用に解決する。screen>=0は「レッスン画面」(id=topicId)、
// screen===-1は「ドリル/クイズの解説」(id=drill/quiz id)を指す(markConfusingの呼び出し規約)
function memoResolve(m) {
  if (m.screen >= 0) {
    var topic = findTopic(m.id);
    var item = topic ? (topic.lesson || [])[m.screen] : null;
    return {
      title: topic ? topic.title : "(削除された論点)",
      preview: item ? String(item.t || "").slice(0, 30) : "",
      screenLabel: "画面" + (m.screen + 1),
      jumpTopicId: topic ? topic.id : null
    };
  }
  var drill = findDrill(m.id);
  var quiz = drill ? null : findQuiz(m.id);
  var parentTopicId = drill ? drillTopicId(m.id) : (quiz ? quizTopicId(m.id) : null);
  var topic2 = parentTopicId ? findTopic(parentTopicId) : null;
  var text = drill ? drill.prompt : (quiz ? quiz.q : "");
  return {
    title: topic2 ? topic2.title : "(削除された問題)",
    preview: String(text || "").slice(0, 30),
    screenLabel: "解説",
    jumpTopicId: topic2 ? topic2.id : null
  };
}

function buildMemoCopyText() {
  return S.memos.map(function (m) {
    var r = memoResolve(m);
    return "【" + m.id + "】" + r.screenLabel + "「" + r.preview + "…」→ " + (m.note || "(メモなし)");
  }).join("\n");
}

// 「前回バックアップ以降に増えた解答数」でリマインダー表示要否を判定する(renderTodayのbackupReminderHtml参照)
function markBackedUp() {
  S.lastBackupAnswers = S.totalAnswers || 0;
  save();
}

// エクスポート(バックアップ)処理。claude.ai Artifact環境では window.claude.use("downloads") の
// ダウンロード機能capabilityを優先利用し(republish時にlocalStorageが消える対策)、
// 未提供/失敗時は従来のBlob+a[download]方式(file://でも動く)にフォールバックする
async function doExport() {
  if (typeof document === "undefined") return;
  var json = exportData();
  var filename = "boki-backup-" + todayStr().replace(/-/g, "") + ".json";
  var dl = null;
  try {
    if (typeof claude !== "undefined" && claude.use) dl = await claude.use("downloads");
  } catch (e) {
    dl = null; // capability自体が使えない環境。Blobフォールバックへ
  }
  if (dl) {
    try {
      await dl.save({ filename: filename, data: json });
      markBackedUp();
      toast("バックアップを保存しました");
      return;
    } catch (err) {
      if (err && err.code === "declined") { return; } // ユーザーが保存を拒否: エラー表示しない
      if (err && err.code === "rate_limited") { toast("少し待ってからもう一度お試しください"); return; }
      // それ以外のエラーコードはBlobフォールバックへ続行
    }
  }
  // Blobフォールバック: a[download]クリックは成功/失敗の完了信号がないため、
  // markBackedUpは楽観的に実行される(実際のダウンロード成功の保証はない)
  try {
    var blob = new Blob([json], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    markBackedUp();
    toast("エクスポートしました: " + filename);
  } catch (err) {
    toast("エクスポートに失敗しました");
  }
}

function importFromFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var ok = importData(String(reader.result || ""));
    if (ok) {
      if (storageAvailable) {
        toast("インポートしました。画面を更新します");
        setTimeout(function () { location.reload(); }, 600);
      } else {
        applyTheme();
        refreshActiveView();
        toast("インポートしました(このセッション内のみ有効です。保存先が利用できないため、閉じるとデータは失われます)");
      }
    } else {
      toast("インポートに失敗しました(ファイル形式を確認してください)");
    }
  };
  reader.onerror = function () { toast("ファイルの読み込みに失敗しました"); };
  reader.readAsText(file);
}

// 全データ初期化(2段階確認): まずconfirmで意思確認、次に「リセット」の完全一致入力を要求する
function resetAllData() {
  if (typeof window === "undefined") return;
  var ok1 = safeConfirm("本当にすべての学習データを削除しますか?この操作は取り消せません。");
  if (!ok1) return;
  var input = safePrompt('確認のため「リセット」と入力してください');
  if (input !== "リセット") { toast("入力が一致しなかったため取り消しました"); return; }
  try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
  S = defaultState();
  save();
  location.reload();
}

function recordClickHandler(e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.dataset.act;
  if (act === "cal-prev") { _recordCalMonth = shiftMonth(_recordCalMonth, -1); renderRecord(); }
  else if (act === "cal-next") { _recordCalMonth = shiftMonth(_recordCalMonth, 1); renderRecord(); }
  else if (act === "memo-review") { startLesson(t.dataset.topic); }
  else if (act === "memo-delete") { S.memos.splice(+t.dataset.idx, 1); save(); renderRecord(); }
  else if (act === "memo-copy") { copyMemoText(); }
  else if (act === "set-goal-record") { S.goalMin = +t.dataset.min; save(); renderRecord(); }
  else if (act === "set-theme") { S.theme = t.dataset.theme; save(); applyTheme(); renderRecord(); }
  else if (act === "record-rename-shop") { renameShop(); renderRecord(); }
  else if (act === "export-data") { doExport(); }
  else if (act === "reset-all") { resetAllData(); }
}

// input[type=date]・input[type=file]は"change"イベントなので、クリック委譲リスナーとは別に登録する
function recordChangeHandler(e) {
  var t = e.target;
  if (t.id === "set-exam-date") {
    S.examDate = t.value || null;
    save();
  } else if (t.id === "import-file-input") {
    importFromFile(t.files && t.files[0]);
  }
}

if (typeof document !== "undefined") {
  var _viewTodayEl = document.getElementById("view-today");
  if (_viewTodayEl) _viewTodayEl.addEventListener("click", todayClickHandler);
  var _viewLearnEl = document.getElementById("view-learn");
  if (_viewLearnEl) _viewLearnEl.addEventListener("click", learnClickHandler);
  var _viewShopEl = document.getElementById("view-shop");
  if (_viewShopEl) _viewShopEl.addEventListener("click", shopClickHandler);
  var _viewDrillEl = document.getElementById("view-drill");
  if (_viewDrillEl) _viewDrillEl.addEventListener("click", drillClickHandler);
  var _viewRecordEl = document.getElementById("view-record");
  if (_viewRecordEl) {
    _viewRecordEl.addEventListener("click", recordClickHandler);
    _viewRecordEl.addEventListener("change", recordChangeHandler);
  }
}

_viewRenderers.today = renderToday;
_viewRenderers.learn = renderLearn;
_viewRenderers.shop = renderShop;
_viewRenderers.drill = renderDrillTab;
_viewRenderers.record = renderRecord;
// 起動時のshowView("today")はこのTask 7コードが読み込まれる前(ファイル冒頭のTask 1ブロック)に
// 実行済みで、その時点では_viewRenderers.todayが未登録だったため画面が空のまま。
// ここで改めて1回描画して初期表示を埋める
if (typeof document !== "undefined") renderToday();

window.Boki = window.Boki || {};
Object.assign(window.Boki, {
  startLesson: startLesson, startDrillSession: startDrillSession, startQuizSession: startQuizSession,
  renderFig: renderFig, markConfusing: markConfusing, figTacct: figTacct, homeSide: homeSide,
  renderToday: renderToday, renderLearn: renderLearn, startReviewQueue: startReviewQueue,
  nextUnclearedTopic: nextUnclearedTopic,
  renderShop: renderShop, SHOP_ITEMS: SHOP_ITEMS, STAGE_NAMES: STAGE_NAMES, shopCounts: shopCounts,
  renderDrillTab: renderDrillTab, renderRecord: renderRecord, applyTheme: applyTheme,
  exportDataFile: doExport, doExport: doExport, importFromFile: importFromFile, resetAllData: resetAllData,
  startReflexQuiz: startReflexQuiz, reflexAcctPool: reflexAcctPool
});

</script>
